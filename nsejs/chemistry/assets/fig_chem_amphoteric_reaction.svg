<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 780 440" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <linearGradient id="panelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect x="0" y="0" width="780" height="440" rx="12" fill="url(#panelGrad2)"/>

  <!-- Title & Header -->
  <text x="30" y="36" fill="#0f172a" font-size="18" font-weight="700">Amphoteric Metal Oxide (M₂O₃) Dual Dissolution Pathways</text>
  <text x="30" y="58" fill="#475569" font-size="14">Stoichiometric Balances with Aqueous Sodium Hydroxide (Base) and Hydrochloric Acid</text>

  <!-- Central Oxide Box -->
  <rect x="270" y="95" width="240" height="90" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <text x="390" y="125" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Amphoteric Oxide M₂O₃</text>
  <text x="390" y="148" text-anchor="middle" fill="#0369a1" font-size="14" font-weight="600">Sample Mass: 1.02 g (0.010 mol)</text>
  <text x="390" y="168" text-anchor="middle" fill="#475569" font-size="14">Molar Mass M_r = 102.0 g/mol (M = Al)</text>

  <!-- Left Arrow to Base -->
  <line x1="260" y1="140" x2="185" y2="140" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-left)"/>
  <text x="220" y="128" text-anchor="middle" fill="#0284c7" font-size="14" font-weight="700">+ NaOH (aq)</text>

  <!-- Left Box: Reaction with Base (NaOH) -->
  <rect x="30" y="95" width="220" height="230" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" fill="#0369a1" font-size="15" font-weight="700">Path 1: Strong Base</text>
  <text x="140" y="152" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="600">M₂O₃ + 2NaOH →</text>
  <text x="140" y="174" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="600">2NaMO₂ + H₂O</text>

  <line x1="45" y1="190" x2="235" y2="190" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="50" y="215" fill="#0f172a" font-size="14" font-weight="600">• Yield: 1.64 g NaMO₂</text>
  <text x="50" y="240" fill="#334155" font-size="14">• Moles formed = 0.020 mol</text>
  <text x="50" y="265" fill="#334155" font-size="14">• M(NaMO₂) = 82.0 g/mol</text>
  <text x="50" y="290" fill="#0369a1" font-size="14" font-weight="700">⇒ Metal M = 27 (Aluminium)</text>

  <!-- Right Arrow to Acid -->
  <line x1="520" y1="140" x2="595" y2="140" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow-right)"/>
  <text x="560" y="128" text-anchor="middle" fill="#0d9488" font-size="14" font-weight="700">+ HCl (aq)</text>

  <!-- Right Box: Reaction with Acid (HCl) -->
  <rect x="530" y="95" width="220" height="230" rx="10" fill="#f0fdf4" stroke="#0d9488" stroke-width="2"/>
  <text x="640" y="125" text-anchor="middle" fill="#065f46" font-size="15" font-weight="700">Path 2: Strong Acid</text>
  <text x="640" y="152" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="600">M₂O₃ + 6HCl →</text>
  <text x="640" y="174" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="600">2MCl₃ + 3H₂O</text>

  <line x1="545" y1="190" x2="735" y2="190" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="550" y="215" fill="#0f172a" font-size="14" font-weight="600">• Stoichiometry: 1 : 6</text>
  <text x="550" y="240" fill="#334155" font-size="14">• HCl needed: 6 × 0.010 mol</text>
  <text x="550" y="265" fill="#334155" font-size="14">• n(HCl) = 0.060 mol</text>
  <text x="550" y="290" fill="#065f46" font-size="14" font-weight="700">⇒ V(0.5M HCl) = 120 mL</text>

  <!-- Bottom Resolution Card -->
  <rect x="30" y="350" width="720" height="68" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="50" y="378" fill="#0f172a" font-size="15" font-weight="700">Analytical Resolution &amp; Verification:</text>
  <text x="50" y="402" fill="#0f766e" font-size="15" font-weight="700">Identified Metal M: Aluminium (Al, M_r = 27.0 u) | Minimum Volume of 0.50 M HCl Required: 120 mL (Verified Option B)</text>
</svg>
