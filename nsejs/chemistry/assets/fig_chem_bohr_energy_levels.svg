<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 780 440" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-down-teal" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-down-purple" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect x="0" y="0" width="780" height="440" rx="12" fill="url(#bgGrad)"/>

  <!-- Title & Header -->
  <text x="30" y="36" fill="#0f172a" font-size="18" font-weight="700">Bohr Model: Stationary Energy Levels &amp; Photon Emissions</text>
  <text x="30" y="58" fill="#475569" font-size="14">Hydrogen (Z = 1) Transitions [Q01] and Singly-Ionized Helium (He⁺, Z = 2) [Q10]</text>

  <!-- Energy Levels (Horizontal dashed grid & lines) -->
  <!-- n = infinity -->
  <line x1="80" y1="90" x2="520" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="530" y="94" fill="#64748b" font-size="14" font-weight="600">n = ∞ (E = 0.00 eV, Ionization Continuum)</text>

  <!-- n = 4 -->
  <line x1="80" y1="125" x2="520" y2="125" stroke="#334155" stroke-width="2"/>
  <text x="530" y="129" fill="#1e293b" font-size="14" font-weight="600">n = 4 (E_H = -0.85 eV | E_He⁺ = -3.40 eV)</text>

  <!-- n = 3 -->
  <line x1="80" y1="165" x2="520" y2="165" stroke="#334155" stroke-width="2"/>
  <text x="530" y="169" fill="#1e293b" font-size="14" font-weight="600">n = 3 (E_H = -1.51 eV | E_He⁺ = -6.04 eV)</text>

  <!-- n = 2 -->
  <line x1="80" y1="230" x2="520" y2="230" stroke="#334155" stroke-width="2"/>
  <text x="530" y="234" fill="#1e293b" font-size="14" font-weight="600">n = 2 (E_H = -3.40 eV | E_He⁺ = -13.60 eV)</text>

  <!-- n = 1 (Ground State) -->
  <line x1="80" y1="340" x2="520" y2="340" stroke="#0f172a" stroke-width="3"/>
  <text x="530" y="344" fill="#0f172a" font-size="15" font-weight="700">n = 1 Ground State (E_H = -13.60 eV)</text>

  <!-- Transition 1: n = 3 -> 1 (H atom, lambda_1) -->
  <line x1="160" y1="168" x2="160" y2="332" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-down)"/>
  <rect x="110" y="240" width="100" height="42" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="160" y="258" text-anchor="middle" fill="#0369a1" font-size="14" font-weight="700">λ₁: 3 → 1</text>
  <text x="160" y="274" text-anchor="middle" fill="#0284c7" font-size="14">ΔE = 12.09 eV</text>

  <!-- Transition 2: n = 2 -> 1 (H atom, lambda_2) -->
  <line x1="290" y1="233" x2="290" y2="332" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow-down-teal)"/>
  <rect x="240" y="260" width="100" height="42" rx="6" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="290" y="278" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="700">λ₂: 2 → 1</text>
  <text x="290" y="294" text-anchor="middle" fill="#0d9488" font-size="14">ΔE = 10.20 eV</text>

  <!-- Transition 3: He⁺ (Z=2) n = 4 -> 2 -->
  <line x1="420" y1="128" x2="420" y2="222" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-down-purple)"/>
  <rect x="360" y="145" width="120" height="42" rx="6" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.2"/>
  <text x="420" y="163" text-anchor="middle" fill="#6b21a8" font-size="14" font-weight="700">He⁺: 4 → 2</text>
  <text x="420" y="179" text-anchor="middle" fill="#7c3aed" font-size="14">ΔE = 10.20 eV</text>

  <!-- Right-hand Summary & Formulation Card -->
  <rect x="80" y="365" width="670" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="388" fill="#0f172a" font-size="14" font-weight="700">Rydberg Transition Formula:</text>
  <text x="310" y="388" fill="#334155" font-size="14">1/λ = R_H · Z² · [1/n_f² - 1/n_i²]</text>
  <text x="100" y="412" fill="#0369a1" font-size="14" font-weight="700">Wavelength Ratio (H: 3→1 vs 2→1):</text>
  <text x="370" y="412" fill="#0d9488" font-size="14" font-weight="700">λ₁ / λ₂ = (3/4) / (8/9) = 27 / 32 = 0.84375 (Verified Option B)</text>
</svg>
