<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Plane mirror virtual image constructed from reflected rays</title><desc id="desc">An object point and observer's eye are in front of a vertical plane mirror. An incident and reflected light ray meet at the mirror, while a dashed backward extension reaches the virtual image at equal perpendicular distance behind the mirror.</desc><rect width="900" height="430" fill="#f8fafc"/><rect x="443" y="75" width="14" height="295" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><text x="399" y="54" font-family="Arial" font-size="20" fill="#334155">Plane mirror</text><circle cx="220" cy="145" r="14" fill="#047857"/><text x="162" y="120" font-family="Arial" font-size="20" fill="#065f46">Object</text><ellipse cx="220" cy="318" rx="24" ry="13" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><text x="177" y="364" font-family="Arial" font-size="20" fill="#92400e">Eye</text><circle cx="680" cy="145" r="14" fill="#9ca3af" stroke="#475569" stroke-width="2"/><text x="690" y="124" font-family="Arial" font-size="20" fill="#475569">Virtual point</text><path d="M220 145L450 232" stroke="#2563eb" stroke-width="5" fill="none"/><path d="M450 232L220 318" stroke="#b45309" stroke-width="5" fill="none"/><path d="M450 232L680 145" stroke="#b45309" stroke-width="3" stroke-dasharray="9 8" fill="none"/><path d="M450 232H580" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6"/><text x="233" y="181" font-family="Arial" font-size="17" fill="#1d4ed8">Incident light</text><text x="228" y="285" font-family="Arial" font-size="17" fill="#92400e">Reflected light</text><text x="588" y="192" font-family="Arial" font-size="17" fill="#475569">Backward extension only</text><text x="28" y="34" font-family="Arial" font-size="23" fill="#17324b">Real rays remain in front of the mirror</text><text x="28" y="400" font-family="Arial" font-size="16" fill="#475569">Object and virtual image are symmetric about the mirror plane; not a real screen image.</text></svg>