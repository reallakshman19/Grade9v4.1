<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Virtual image via two rays</title><desc id="desc">Object and two actual reflected paths to eyes; dashed extensions meet behind the plane mirror.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect x="0" y="0" width="620" height="320" rx="8" fill="#f8fafc"/><text x="18" y="23" text-anchor="start" fill="#172b42" font-size="13">PH09-02 · Virtual image via two rays</text><line x1="315" y1="45" x2="315" y2="245" stroke="#475569" stroke-width="1.5"  /><line x1="320" y1="45" x2="320" y2="245" stroke="#cbd5e1" stroke-width="1.5"  /><circle cx="170" cy="150" r="3.7" fill="#0e7490"/><text x="170" y="138" text-anchor="middle" fill="#172b42" font-size="13">object</text><circle cx="460" cy="150" r="3.7" fill="#0e7490"/><text x="460" y="138" text-anchor="middle" fill="#172b42" font-size="13">virtual image</text><circle cx="95" cy="64" r="3.7" fill="#0e7490"/><text x="95" y="52" text-anchor="middle" fill="#172b42" font-size="13">eye 1</text><circle cx="95" cy="236" r="3.7" fill="#0e7490"/><text x="95" y="224" text-anchor="middle" fill="#172b42" font-size="13">eye 2</text><line x1="170" y1="150" x2="315" y2="116" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="315" y1="116" x2="95" y2="64" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="315" y1="116" x2="460" y2="150" stroke="#b45309" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="170" y1="150" x2="315" y2="184" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="315" y1="184" x2="95" y2="236" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="315" y1="184" x2="460" y2="150" stroke="#b45309" stroke-width="1.5"  stroke-dasharray="6 5"/><text x="315" y="282" text-anchor="middle" fill="#172b42" font-size="13">mirror</text><text x="310" y="303" text-anchor="middle" fill="#172b42" font-size="13">The dashed extensions do not carry reflected light.</text></svg>
