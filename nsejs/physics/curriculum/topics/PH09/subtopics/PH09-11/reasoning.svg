<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Mirror intercepts convergence</title><desc id="desc">A plane mirror intercepts converging rays before a lens's would-be focus and returns them to a real focus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect x="0" y="0" width="620" height="320" rx="8" fill="#f8fafc"/><text x="18" y="23" text-anchor="start" fill="#172b42" font-size="13">PH09-11 · Mirror intercepts convergence</text><line x1="20" y1="165" x2="600" y2="165" stroke="#94a3b8" stroke-width="1.5"  /><line x1="100" y1="62" x2="100" y2="268" stroke="#0e7490" stroke-width="1.5"  /><line x1="365" y1="60" x2="365" y2="260" stroke="#475569" stroke-width="1.5"  /><line x1="370" y1="60" x2="370" y2="260" stroke="#cbd5e1" stroke-width="1.5"  /><circle cx="540" cy="165" r="3.7" fill="#b45309"/><text x="540" y="188" text-anchor="middle" fill="#172b42" font-size="13">would-be focus x=20</text><circle cx="190" cy="165" r="3.7" fill="#b45309"/><text x="190" y="188" text-anchor="middle" fill="#172b42" font-size="13">return focus x=4</text><line x1="100" y1="92" x2="365" y2="136" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="100" y1="238" x2="365" y2="194" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="365" y1="136" x2="540" y2="165" stroke="#b45309" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="365" y1="194" x2="540" y2="165" stroke="#b45309" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="365" y1="136" x2="190" y2="165" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="365" y1="194" x2="190" y2="165" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)" /><text x="100" y="53" text-anchor="middle" fill="#172b42" font-size="13">lens x=0</text><text x="365" y="53" text-anchor="middle" fill="#172b42" font-size="13">mirror x=12</text><text x="310" y="294" text-anchor="middle" fill="#172b42" font-size="13">Solid rays converge on return; dashed continuation is intercepted.</text></svg>
