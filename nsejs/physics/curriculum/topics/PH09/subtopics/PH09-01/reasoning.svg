<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Reflection angles</title><desc id="desc">Horizontal mirror and two equal angles measured from the normal, not surface.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect x="0" y="0" width="620" height="320" rx="8" fill="#f8fafc"/><text x="18" y="23" text-anchor="start" fill="#172b42" font-size="13">PH09-01 · Reflection angles</text><line x1="55" y1="206" x2="565" y2="206" stroke="#475569" stroke-width="1.5"  /><line x1="55" y1="211" x2="565" y2="211" stroke="#cbd5e1" stroke-width="1.5"  /><line x1="310" y1="45" x2="310" y2="264" stroke="#64748b" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="135" y1="90" x2="310" y2="206" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="310" y1="206" x2="485" y2="90" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><text x="310" y="54" text-anchor="middle" fill="#172b42" font-size="13">normal</text><text x="180" y="75" text-anchor="start" fill="#172b42" font-size="13">incident</text><text x="445" y="75" text-anchor="start" fill="#172b42" font-size="13">reflected</text><text x="264" y="161" text-anchor="start" fill="#172b42" font-size="13">i</text><text x="344" y="161" text-anchor="start" fill="#172b42" font-size="13">r</text><text x="310" y="285" text-anchor="middle" fill="#172b42" font-size="13">i = r, each measured from the normal</text></svg>
