<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Mirror measurement geometry</title><desc id="desc">Finite-distance object and screen positions are conjugates; focal point lies between screen and mirror.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect x="0" y="0" width="620" height="320" rx="8" fill="#f8fafc"/><text x="18" y="23" text-anchor="start" fill="#172b42" font-size="13">PH09-10 · Mirror measurement geometry</text><line x1="20" y1="160" x2="600" y2="160" stroke="#94a3b8" stroke-width="1.5"  /><line x1="500" y1="45" x2="500" y2="245" stroke="#475569" stroke-width="1.5"  /><line x1="505" y1="45" x2="505" y2="245" stroke="#cbd5e1" stroke-width="1.5"  /><circle cx="140" cy="160" r="3.7" fill="#0e7490"/><text x="140" y="180" text-anchor="middle" fill="#172b42" font-size="13">O: −50</text><circle cx="410" cy="160" r="3.7" fill="#b45309"/><text x="410" y="180" text-anchor="middle" fill="#172b42" font-size="13">I: −12.5</text><circle cx="428" cy="160" r="3.7" fill="#0e7490"/><text x="448" y="147" text-anchor="middle" fill="#172b42" font-size="13">F: −10</text><line x1="140" y1="160" x2="140" y2="116" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><text x="140" y="106" text-anchor="middle" fill="#172b42" font-size="13">object</text><line x1="410" y1="160" x2="410" y2="171" stroke="#b45309" stroke-width="2.4" marker-end="url(#arrow)" /><text x="410" y="188" text-anchor="middle" fill="#172b42" font-size="13">image</text><line x1="410" y1="78" x2="410" y2="250" stroke="#a16207" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="140" y1="116" x2="500" y2="116" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="500" y1="116" x2="410" y2="171" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="140" y1="116" x2="500" y2="160" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="500" y1="160" x2="410" y2="171" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)" /><text x="410" y="66" text-anchor="middle" fill="#172b42" font-size="13">screen</text><text x="500" y="185" text-anchor="middle" fill="#172b42" font-size="13">P</text><text x="310" y="292" text-anchor="middle" fill="#172b42" font-size="13">q = 12.5 cm is greater than F = 10 cm.</text></svg>
