<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Two perpendicular mirrors</title><desc id="desc">Four point locations in unfolded plane; the three images are formal transformed points; visibility needs a path check.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect x="0" y="0" width="620" height="320" rx="8" fill="#f8fafc"/><text x="18" y="23" text-anchor="start" fill="#172b42" font-size="13">PH09-05 · Two perpendicular mirrors</text><line x1="310" y1="48" x2="310" y2="154" stroke="#475569" stroke-width="1.5"  /><line x1="310" y1="154" x2="565" y2="154" stroke="#475569" stroke-width="1.5"  /><line x1="55" y1="154" x2="310" y2="154" stroke="#94a3b8" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="310" y1="154" x2="310" y2="268" stroke="#94a3b8" stroke-width="1.5"  stroke-dasharray="6 5"/><circle cx="410" cy="93" r="3.7" fill="#0e7490"/><text x="410" y="81" text-anchor="middle" fill="#172b42" font-size="13">O (2,3)</text><circle cx="210" cy="93" r="3.7" fill="#b45309"/><text x="210" y="81" text-anchor="middle" fill="#172b42" font-size="13">I₁ (−2,3)</text><circle cx="410" cy="215" r="3.7" fill="#b45309"/><text x="410" y="235" text-anchor="middle" fill="#172b42" font-size="13">I₂ (2,−3)</text><circle cx="210" cy="215" r="3.7" fill="#b45309"/><text x="210" y="235" text-anchor="middle" fill="#172b42" font-size="13">I₁₂ (−2,−3)</text><line x1="410" y1="93" x2="210" y2="93" stroke="#b45309" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="410" y1="93" x2="410" y2="215" stroke="#b45309" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="210" y1="93" x2="210" y2="215" stroke="#b45309" stroke-width="1.5"  stroke-dasharray="6 5"/><text x="310" y="296" text-anchor="middle" fill="#172b42" font-size="13">Transformed points ≠ guaranteed visible images</text></svg>
