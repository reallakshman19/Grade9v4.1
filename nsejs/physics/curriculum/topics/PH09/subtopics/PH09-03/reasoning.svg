<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Normal coordinate reversal</title><desc id="desc">Reflection across x=0 reverses perpendicular component and preserves tangential component.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect x="0" y="0" width="620" height="320" rx="8" fill="#f8fafc"/><text x="18" y="23" text-anchor="start" fill="#172b42" font-size="13">PH09-03 · Normal coordinate reversal</text><line x1="20" y1="175" x2="600" y2="175" stroke="#94a3b8" stroke-width="1.5"  /><line x1="310" y1="40" x2="310" y2="275" stroke="#475569" stroke-width="1.5"  /><line x1="315" y1="40" x2="315" y2="275" stroke="#cbd5e1" stroke-width="1.5"  /><line x1="142" y1="208" x2="236" y2="108" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrow)" /><line x1="478" y1="208" x2="384" y2="108" stroke="#b45309" stroke-width="2.4" marker-end="url(#arrow)" /><circle cx="142" cy="208" r="3.7" fill="#0e7490"/><text x="142" y="226" text-anchor="middle" fill="#172b42" font-size="13">tail</text><circle cx="478" cy="208" r="3.7" fill="#0e7490"/><text x="478" y="226" text-anchor="middle" fill="#172b42" font-size="13">tail′</text><text x="216" y="93" text-anchor="start" fill="#172b42" font-size="13">tip</text><text x="388" y="93" text-anchor="start" fill="#172b42" font-size="13">tip′</text><text x="590" y="165" text-anchor="end" fill="#172b42" font-size="13">+x</text><text x="318" y="60" text-anchor="start" fill="#172b42" font-size="13">+y</text><text x="310" y="300" text-anchor="middle" fill="#172b42" font-size="13">x → −x; y unchanged</text></svg>
