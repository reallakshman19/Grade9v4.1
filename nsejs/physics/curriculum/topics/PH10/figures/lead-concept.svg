<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
<title id="title">Two lens positions for fixed object and screen</title>
<desc id="desc">A real object on the left and screen on the right remain fixed. Two alternative lens positions at 30 and 60 cm are shown for object-screen distance 90 cm and focal length 20 cm. One lens is drawn solid and the alternative dashed.</desc>
<rect width="920" height="450" fill="#f8fafc"/>
<text x="32" y="44" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102a43">Fixed object-screen track, two lens positions</text>
<path d="M58 245H850" stroke="#475569" stroke-width="3"/>
<path d="M94 245V128" stroke="#0f766e" stroke-width="6"/>
<path d="M82 142l12-22 12 22" stroke="#0f766e" stroke-width="5" fill="none"/>
<text x="55" y="107" font-family="Arial" font-size="20" fill="#065f46">Object</text>
<rect x="826" y="107" width="17" height="238" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
<text x="807" y="89" font-family="Arial" font-size="20" fill="#334155">Screen</text>
<path d="M338 116Q372 245 338 346Q304 245 338 116Z" fill="#bfdbfe" opacity=".68" stroke="#2563eb" stroke-width="4"/>
<text x="295" y="378" font-family="Arial" font-size="18" fill="#1d4ed8">Lens A</text>
<path d="M580 116Q614 245 580 346Q546 245 580 116Z" fill="#e2e8f0" stroke="#64748b" stroke-dasharray="9 6" stroke-width="4"/>
<text x="538" y="378" font-family="Arial" font-size="18" fill="#475569">Lens B</text>
<g stroke-width="3" fill="none" opacity=".9">
<path d="M94 126L338 126L828 341" stroke="#0ea5e9"/>
<path d="M94 126L338 245L828 341" stroke="#0ea5e9"/>
</g>
<path d="M94 399H338M338 399H580M580 399H833" stroke="#64748b" stroke-width="2"/>
<path d="M94 392v14M338 392v14M580 392v14M833 392v14" stroke="#64748b" stroke-width="2"/>
<text x="165" y="424" font-family="Arial" font-size="17" fill="#334155">x₁ = 30 cm</text>
<text x="375" y="424" font-family="Arial" font-size="17" fill="#334155">d = 30 cm</text>
<text x="648" y="424" font-family="Arial" font-size="17" fill="#334155">D = 90 cm total</text>
<text x="40" y="73" font-family="Arial" font-size="16" fill="#475569">Illustrative thin-lens construction · f = 20 cm · diagrams schematic (not scale accurate rays for both states)</text>
</svg>