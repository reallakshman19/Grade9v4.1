<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Normal and oblique incidence</title><desc id="desc">Air-to-glass rays: normal ray continues straight; oblique ray bends toward the normal.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="620" height="320" rx="8" fill="#f8fafc"/><text x="310" y="23" fill="#172b42" text-anchor="middle" font-size="13">PH10-01 · Normal and oblique incidence</text><rect x="25" y="155" width="570" height="125" fill="#dbeafe"/><line x1="25" y1="155" x2="595" y2="155" stroke="#64748b" stroke-width="1.5"  /><text x="80" y="140" fill="#172b42" text-anchor="middle" font-size="13">air n=1</text><text x="90" y="180" fill="#172b42" text-anchor="middle" font-size="13">glass n=1.5</text><line x1="175" y1="57" x2="175" y2="155" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="175" y1="155" x2="175" y2="253" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><text x="175" y="50" fill="#172b42" text-anchor="middle" font-size="13">normal incidence</text><line x1="410" y1="55" x2="410" y2="270" stroke="#64748b" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="325" y1="70" x2="410" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><line x1="410" y1="155" x2="460.77963596336065" y2="250" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><text x="365" y="63" fill="#172b42" text-anchor="middle" font-size="13">oblique</text><text x="310" y="296" fill="#172b42" text-anchor="middle" font-size="13">Both rays change speed; only oblique incidence bends.</text></svg>
