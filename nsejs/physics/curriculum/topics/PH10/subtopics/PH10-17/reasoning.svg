#172b42" text-anchor="middle" font-size="13">no propagating transmitted ray</text><text x="310" y="303" fill="#172b42" text-anchor="middle" font-size="13">Critical angle ≈41.8° for glass → air; strict i&gt;i_c gives TIR.</text></svg>
