<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Scattering ratio</title><desc id="desc">Relative Rayleigh intensity for 450 and 650 nm; not a universal scattering law.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="620" height="320" rx="8" fill="#f8fafc"/><text x="310" y="23" fill="#172b42" text-anchor="middle" font-size="13">PH10-11 · Scattering ratio</text><line x1="85" y1="255" x2="550" y2="255" stroke="#64748b" stroke-width="1.5"  /><line x1="85" y1="255" x2="85" y2="62" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)" /><rect x="165" y="81" width="105" height="174" fill="#2563eb"/><rect x="350" y="215" width="105" height="40" fill="#b91c1c"/><text x="218" y="71" fill="#172b42" text-anchor="middle" font-size="13">4.35</text><text x="402" y="205" fill="#172b42" text-anchor="middle" font-size="13">1</text><text x="218" y="276" fill="#172b42" text-anchor="middle" font-size="13">450 nm</text><text x="402" y="276" fill="#172b42" text-anchor="middle" font-size="13">650 nm</text><text x="180" y="50" fill="#172b42" text-anchor="middle" font-size="13">relative scattered intensity</text><text x="310" y="303" fill="#172b42" text-anchor="middle" font-size="13">Rayleigh only: I₄₅₀ / I₆₅₀ ≈ (650/450)⁴.</text></svg>
