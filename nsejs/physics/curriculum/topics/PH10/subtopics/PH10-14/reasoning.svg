<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Bench measurement</title><desc id="desc">Measure real conjugate distances from lens centre; finite q is not F.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="620" height="320" rx="8" fill="#f8fafc"/><text x="310" y="23" fill="#172b42" text-anchor="middle" font-size="13">PH10-14 · Bench measurement</text><line x1="20" y1="160" x2="600" y2="160" stroke="#64748b" stroke-width="1.5"  /><line x1="430" y1="45" x2="430" y2="270" stroke="#0e7490" stroke-width="1.5"  /><path d="M423 57L430 45L437 57M423 258L430 270L437 258" fill="none" stroke="#0e7490" stroke-width="2"/><line x1="50" y1="160" x2="50" y2="120" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><text x="50" y="110" fill="#172b42" text-anchor="middle" font-size="13">object</text><line x1="525" y1="160" x2="525" y2="170" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr)" /><text x="525" y="187" fill="#172b42" text-anchor="middle" font-size="13">image</text><line x1="525" y1="60" x2="525" y2="260" stroke="#b45309" stroke-width="1.5"  stroke-dasharray="6 5"/><line x1="50" y1="120" x2="430" y2="120" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="430" y1="120" x2="525" y2="170" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="50" y1="120" x2="430" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><line x1="430" y1="160" x2="525" y2="170" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><circle cx="506" cy="160" r="3.5" fill="#b45309"/><text x="506" y="145" fill="#172b42" text-anchor="middle" font-size="13">F=20</text><text x="525" y="53" fill="#172b42" text-anchor="middle" font-size="13">screen</text><text x="240" y="286" fill="#172b42" text-anchor="middle" font-size="13">d=100 cm</text><text x="478" y="286" fill="#172b42" text-anchor="middle" font-size="13">q=25 cm</text><line x1="50" y1="270" x2="430" y2="270" stroke="#64748b" stroke-width="1.5"  /><line x1="430" y1="270" x2="525" y2="270" stroke="#64748b" stroke-width="1.5"  /><text x="310" y="305" fill="#172b42" text-anchor="middle" font-size="13">F = dq/(d+q), not simply q for finite d.</text></svg>
