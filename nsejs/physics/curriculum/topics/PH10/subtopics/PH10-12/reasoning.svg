<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Accommodation</title><desc id="desc">Distant and near rays converge at the same fixed retina with different lens powers.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="620" height="320" rx="8" fill="#f8fafc"/><text x="310" y="23" fill="#172b42" text-anchor="middle" font-size="13">PH10-12 · Accommodation</text><line x1="30" y1="91" x2="570" y2="91" stroke="#64748b" stroke-width="1.5"  /><line x1="300" y1="44" x2="300" y2="138" stroke="#0e7490" stroke-width="1.5"  /><path d="M293 56L300 44L307 56M293 126L300 138L307 126" fill="none" stroke="#0e7490" stroke-width="2"/><line x1="530" y1="42" x2="530" y2="143" stroke="#b45309" stroke-width="1.5"  /><line x1="50" y1="63" x2="300" y2="63" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="300" y1="63" x2="530" y2="91" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="50" y1="119" x2="300" y2="119" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><line x1="300" y1="119" x2="530" y2="91" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><text x="110" y="50" fill="#172b42" text-anchor="middle" font-size="13">distant rays</text><text x="530" y="38" fill="#172b42" text-anchor="middle" font-size="13">retina</text><line x1="30" y1="225" x2="570" y2="225" stroke="#64748b" stroke-width="1.5"  /><line x1="300" y1="177" x2="300" y2="273" stroke="#0e7490" stroke-width="1.5"  /><path d="M293 189L300 177L307 189M293 261L300 273L307 261" fill="none" stroke="#0e7490" stroke-width="2"/><line x1="530" y1="174" x2="530" y2="276" stroke="#b45309" stroke-width="1.5"  /><circle cx="75" cy="225" r="3.5" fill="#b45309"/><text x="75" y="245" fill="#172b42" text-anchor="middle" font-size="13">near object</text><line x1="75" y1="225" x2="300" y2="193" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="300" y1="193" x2="530" y2="225" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="75" y1="225" x2="300" y2="257" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><line x1="300" y1="257" x2="530" y2="225" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><text x="310" y="303" fill="#172b42" text-anchor="middle" font-size="13">Greater near-object divergence requires greater optical power.</text></svg>
