<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">Myopia correction</title><desc id="desc">Uncorrected distant rays converge before retina; diverging correction changes vergence to focus on retina.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="620" height="320" rx="8" fill="#f8fafc"/><text x="310" y="23" fill="#172b42" text-anchor="middle" font-size="13">PH10-13 · Myopia correction</text><line x1="35" y1="91" x2="570" y2="91" stroke="#64748b" stroke-width="1.5"  /><line x1="300" y1="45" x2="300" y2="137" stroke="#0e7490" stroke-width="1.5"  /><path d="M293 57L300 45L307 57M293 125L300 137L307 125" fill="none" stroke="#0e7490" stroke-width="2"/><line x1="520" y1="42" x2="520" y2="140" stroke="#b45309" stroke-width="1.5"  /><line x1="45" y1="65" x2="300" y2="65" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="300" y1="65" x2="430" y2="91" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="430" y1="91" x2="520" y2="109" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="45" y1="117" x2="300" y2="117" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><line x1="300" y1="117" x2="430" y2="91" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><line x1="430" y1="91" x2="520" y2="73" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><text x="430" y="82" fill="#172b42" text-anchor="middle" font-size="13">focus</text><text x="520" y="37" fill="#172b42" text-anchor="middle" font-size="13">retina</text><line x1="35" y1="225" x2="570" y2="225" stroke="#64748b" stroke-width="1.5"  /><line x1="180" y1="179" x2="180" y2="271" stroke="#7e22ce" stroke-width="1.5"  /><line x1="300" y1="177" x2="300" y2="273" stroke="#0e7490" stroke-width="1.5"  /><path d="M293 189L300 177L307 189M293 261L300 273L307 261" fill="none" stroke="#0e7490" stroke-width="2"/><line x1="520" y1="174" x2="520" y2="276" stroke="#b45309" stroke-width="1.5"  /><line x1="45" y1="207" x2="180" y2="207" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="180" y1="207" x2="300" y2="196.07" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="300" y1="196.07" x2="520" y2="225" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arr)" /><line x1="45" y1="243" x2="180" y2="243" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><line x1="180" y1="243" x2="300" y2="253.93" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><line x1="300" y1="253.93" x2="520" y2="225" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)" /><text x="180" y="170" fill="#172b42" text-anchor="middle" font-size="13">diverging correction</text><text x="520" y="166" fill="#172b42" text-anchor="middle" font-size="13">retina</text><text x="310" y="304" fill="#172b42" text-anchor="middle" font-size="13">Simplified correction; not a clinical prescription.</text></svg>
