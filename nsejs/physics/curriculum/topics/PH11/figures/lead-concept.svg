<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Two resistors in parallel across a source</title><desc id="desc">A 6-ohm and a 3-ohm resistor connect between the same left and right circuit nodes A and B. The branches carry currents of 2 and 4 amperes for an ideal twelve-volt source and the source current is six amperes.</desc><rect width="900" height="430" fill="#f8fafc"/><text x="28" y="39" font-size="23" font-family="Arial" fill="#17324b">Parallel means the same two endpoint nodes</text><g stroke="#475569" stroke-width="5" fill="none"><path d="M185 110V344M725 110V344M185 145H360M490 145H725M185 255H360M490 255H725M185 344H388M512 344H725"/></g><rect x="360" y="121" width="130" height="48" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><rect x="360" y="231" width="130" height="48" rx="5" fill="#dcfce7" stroke="#047857" stroke-width="4"/><text x="402" y="152" font-family="Arial" font-size="22" fill="#1e3a8a">6 Ω</text><text x="402" y="263" font-family="Arial" font-size="22" fill="#065f46">3 Ω</text><rect x="388" y="318" width="124" height="52" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/><text x="406" y="349" font-family="Arial" font-size="19" fill="#92400e">12 V</text><text x="191" y="336" font-family="Arial" font-size="20" fill="#92400e">+</text><text x="705" y="336" font-family="Arial" font-size="20" fill="#92400e">−</text><g fill="#0f766e"><circle cx="185" cy="145" r="10"/><circle cx="725" cy="145" r="10"/><circle cx="185" cy="255" r="10"/><circle cx="725" cy="255" r="10"/></g><path d="M230 131h75l-15-12m15 12l-15 12" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M230 241h75l-15-12m15 12l-15 12" stroke="#047857" stroke-width="4" fill="none"/><text x="255" y="112" font-family="Arial" font-size="20" fill="#1d4ed8">I₁=2 A</text><text x="255" y="222" font-family="Arial" font-size="20" fill="#065f46">I₂=4 A</text><text x="150" y="95" font-family="Arial" font-size="22" fill="#334155">A</text><text x="705" y="95" font-family="Arial" font-size="22" fill="#334155">B</text><text x="45" y="404" font-family="Arial" font-size="19" fill="#475569">Each branch has 12 V; total current is 6 A. Diagram assumes an ideal source.</text></svg>