<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">Idealized daytime coastal thermal circulation</title><desc id="desc">A cooler sea on the left and warmer land on the right are illuminated by sunlight. A possible sea-to-land near-surface flow, warmer rising air above land, and return flow aloft are shown as conditional arrows.</desc><rect width="900" height="400" fill="#f7fafc"/><path d="M25 245H450V370H25Z" fill="#93c5fd"/><path d="M450 245H875V370H450Z" fill="#d6ae7a"/><text x="130" y="287" font-size="28" font-family="Arial" fill="#164e76">SEA · cooler</text><text x="564" y="287" font-size="28" font-family="Arial" fill="#704214">LAND · warmer</text><circle cx="758" cy="70" r="36" fill="#fbbf24"/><g stroke="#eab308" stroke-width="5"><path d="M758 14V25M758 117V130M704 70H720M796 70H815"/></g><path d="M300 221H610" stroke="#0369a1" stroke-width="7" fill="none"/><path d="M592 205L620 221L592 237" stroke="#0369a1" stroke-width="7" fill="none"/><path d="M685 226V122" stroke="#c2410c" stroke-width="7" fill="none"/><path d="M669 141L685 113L701 141" stroke="#c2410c" stroke-width="7" fill="none"/><path d="M650 101H295" stroke="#64748b" stroke-width="5" stroke-dasharray="10 7"/><path d="M314 86L285 101L314 117" stroke="#64748b" stroke-width="5" fill="none"/><text x="316" y="210" font-size="18" font-family="Arial" fill="#075985">Possible near-surface flow</text><text x="708" y="161" font-size="18" font-family="Arial" fill="#9a3412">Warm rising air</text><text x="330" y="88" font-size="18" font-family="Arial" fill="#475569">Return flow aloft</text><text x="38" y="36" font-size="23" font-family="Arial" fill="#17324b">Qualitative sea-breeze mechanism</text><text x="38" y="389" font-size="15" font-family="Arial" fill="#475569">Illustration only: regional pressure, wind and heat exchanges determine real flow.</text></svg>