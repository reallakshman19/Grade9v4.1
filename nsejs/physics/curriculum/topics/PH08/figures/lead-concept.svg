<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Echo reflection geometry and time of flight</title>
<desc id="desc">A source and listener at the left send a sound pulse to a reflecting wall at the right. An outgoing and a return arrow mark equal 85 metre legs, each contributing to a half-second total in the example.</desc>
<rect width="900" height="420" fill="#f8fafc"/>
<text x="38" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#102a43">Echo: the full travel path matters</text>
<rect x="750" y="88" width="52" height="248" rx="5" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
<g stroke="#94a3b8" stroke-width="3"><path d="M750 100l52 48M750 148l52 48M750 196l52 48M750 244l52 48M750 292l48 44"/></g>
<text x="758" y="75" font-size="19" fill="#334155" font-family="Arial">Wall</text>
<circle cx="125" cy="207" r="37" fill="#0f766e"/>
<text x="93" y="215" font-size="20" fill="white" font-family="Arial">S / M</text>
<text x="48" y="278" font-size="18" fill="#334155" font-family="Arial">Source + mic</text>
<path d="M165 167H735" stroke="#2563eb" stroke-width="6"/>
<path d="M720 153L740 167L720 181" fill="none" stroke="#2563eb" stroke-width="6"/>
<path d="M735 248H165" stroke="#d97706" stroke-width="6"/>
<path d="M182 234L162 248L182 262" fill="none" stroke="#d97706" stroke-width="6"/>
<text x="327" y="142" font-size="19" fill="#1e40af" font-family="Arial">Outgoing 85 m</text>
<text x="324" y="288" font-size="19" fill="#92400e" font-family="Arial">Returning 85 m</text>
<text x="90" y="365" font-size="19" fill="#334155" font-family="Arial">Total path = 170 m. At 340 m/s, time = 0.50 s.</text>
<text x="90" y="394" font-size="16" fill="#64748b" font-family="Arial">This symmetric diagram is one model, not a rule for arbitrary microphone positions.</text>
</svg>