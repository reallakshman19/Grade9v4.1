<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Changing magnetic linkage can induce electrical response</title><desc id="desc">Two sequential panels show a bar magnet moving toward a conducting coil and then held stationary. The qualitative meter may respond during changing linkage and shows no continuing response when the magnetic conditions stop changing.</desc><rect width="900" height="430" fill="#f8fafc"/><text x="30" y="37" font-size="23" font-family="Arial" fill="#17324b">Induction depends on change, not just a nearby magnet</text><rect x="22" y="67" width="416" height="296" rx="12" fill="white" stroke="#cbd5e1" stroke-width="3"/><rect x="463" y="67" width="416" height="296" rx="12" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="50" y="105" font-size="20" font-family="Arial" fill="#334155">A. Magnet approaches</text><text x="492" y="105" font-size="20" font-family="Arial" fill="#334155">B. Magnet held still</text><g><rect x="74" y="183" width="110" height="52" fill="#2563eb"/><rect x="129" y="183" width="55" height="52" fill="#dc2626"/><text x="97" y="218" font-size="25" font-family="Arial" fill="white">S</text><text x="148" y="218" font-size="25" font-family="Arial" fill="white">N</text><path d="M193 209h43m-17-15l18 15l-18 15" stroke="#b45309" stroke-width="6" fill="none"/></g><g stroke="#0f766e" stroke-width="6" fill="none"><ellipse cx="292" cy="210" rx="16" ry="72"/><ellipse cx="313" cy="210" rx="16" ry="72"/><ellipse cx="334" cy="210" rx="16" ry="72"/><ellipse cx="355" cy="210" rx="16" ry="72"/></g><path d="M355 282L385 308H398" stroke="#475569" stroke-width="3" fill="none"/><circle cx="401" cy="308" r="18" fill="#fde68a" stroke="#92400e" stroke-width="3"/><text x="387" y="346" font-family="Arial" font-size="14" fill="#475569">Meter</text><g><rect x="518" y="183" width="110" height="52" fill="#2563eb"/><rect x="573" y="183" width="55" height="52" fill="#dc2626"/><text x="541" y="218" font-size="25" font-family="Arial" fill="white">S</text><text x="591" y="218" font-size="25" font-family="Arial" fill="white">N</text></g><g stroke="#0f766e" stroke-width="6" fill="none"><ellipse cx="737" cy="210" rx="16" ry="72"/><ellipse cx="758" cy="210" rx="16" ry="72"/><ellipse cx="779" cy="210" rx="16" ry="72"/><ellipse cx="800" cy="210" rx="16" ry="72"/></g><text x="667" y="310" font-family="Arial" font-size="18" fill="#475569">No continuing signal</text><text x="40" y="394" font-family="Arial" font-size="17" fill="#475569">Qualitative only: current requires a closed path; no specific current direction is given.</text></svg>