<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300"><title>Two reflected orientations</title><desc>A=(3,0), B=(4,3) or (4,−3). Both are five units from O and square root of ten units from A.</desc><rect width="600" height="300" fill="#f4fafb"/><g stroke="#57758a" stroke-width="2"><path d="M60 150H560 M140 10V290"/><path stroke-dasharray="6 5" d="M140 150L300 30 M140 150L300 270 M260 150L300 30 M260 150L300 270"/></g><g fill="#10736f"><circle cx="260" cy="150" r="5"/><circle cx="300" cy="30" r="6"/><circle cx="300" cy="270" r="6"/></g><g fill="#17394a" font-size="16"><text x="116" y="170">O</text><text x="246" y="170">A (3,0)</text><text x="312" y="33">B (4,3)</text><text x="312" y="273">B (4,−3)</text><text x="510" y="173">east</text><text x="149" y="20">north</text></g></svg>
