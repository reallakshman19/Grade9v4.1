<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270"><title>Right-angle routes and the same endpoint</title><desc>Two perpendicular routes from O to endpoint E, with different turn points and the same total length.</desc><rect width="600" height="270" fill="#f4fafb"/><g stroke="#57758a" stroke-width="1.5"><path d="M70 220H560 M100 240V20"/></g><path d="M100 220H340V60" fill="none" stroke="#10736f" stroke-width="4"/><path d="M100 220L400 180L340 60" fill="none" stroke="#a4521b" stroke-width="4"/><path d="M100 220L340 60" stroke="#57758a" stroke-width="2" stroke-dasharray="6 4"/><g fill="#17394a" font-size="15"><text x="77" y="239">O</text><text x="350" y="57">E</text><text x="345" y="220">Turn 1</text><text x="410" y="180">Turn 2</text><text x="130" y="107">Same displacement</text></g></svg>
