<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300"><title>Two right-angle routes with the same endpoint</title><desc>Both routes go from O to (3,4). One turns at (3,0), the other at (3.84,1.12). Both have total distance 7 and displacement magnitude 5.</desc><rect width="600" height="300" fill="#f4fafb"/><g stroke="#57758a" stroke-width="1.5"><path d="M65 230H560 M100 280V20"/></g><path d="M100 230H220V70" fill="none" stroke="#10736f" stroke-width="4"/><path d="M100 230L253.6 185.2L220 70" fill="none" stroke="#a4521b" stroke-width="4"/><path d="M100 230L220 70" stroke="#57758a" stroke-width="2" stroke-dasharray="6 4"/><g fill="#17394a" font-size="15"><text x="77" y="250">O</text><text x="230" y="67">E (3,4)</text><text x="225" y="251">Turn 1 (3,0)</text><text x="266" y="184">Turn 2 (3.84,1.12)</text><text x="30" y="89">Same endpoint</text></g></svg>
