<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270"><title>External gears and coaxial spool</title><desc>Three adjacent gears A B C rotate clockwise, anticlockwise, clockwise. A spool on C converts rotations into vertical string travel.</desc><rect width="600" height="270" fill="#f4fafb"/><g stroke="#57758a" stroke-width="2" fill="#e9f5f5"><circle cx="135" cy="110" r="52"/><circle cx="252" cy="110" r="65"/><circle cx="370" cy="110" r="53"/></g><g fill="#17394a" font-size="20" font-weight="bold" text-anchor="middle"><text x="135" y="117">A ↻</text><text x="252" y="117">B ↺</text><text x="370" y="117">C ↻</text></g><circle cx="370" cy="110" r="23" stroke="#a4521b" stroke-width="3" fill="none"/><path d="M393 110V208" stroke="#a4521b" stroke-width="3"/><rect x="375" y="208" width="36" height="27" fill="#a4521b"/><g fill="#17394a" font-size="15"><text x="428" y="110">spool radius r</text><text x="428" y="222">load</text><text x="110" y="252">Two external meshes restore the original sense.</text></g></svg>
