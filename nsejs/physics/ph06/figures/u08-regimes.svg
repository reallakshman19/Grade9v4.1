<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 373" role="img" aria-labelledby="title desc"><title id="title">Four load regimes</title><desc id="desc">Same height and depth scale; upper layer 20 cm; float 40 cm; final case shown sinking.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><g font-family="Arial,sans-serif" fill="#174858" font-size="17"><g transform="translate(12 0)"><rect x="0" y="110" width="150" height="68" fill="#e8efcf"/><rect x="0" y="178" width="150" height="141" fill="#dce7f5"/><path d="M0 95V319H150V95M0 110H150M0 178H150" stroke="#3a6a92" stroke-width="2" fill="none"/><rect x="58" y="19.3322" width="39" height="136" rx="3" fill="#d7f0e7" stroke="#167a6e" stroke-width="2.5"/><text x="75" y="15" text-anchor="middle" font-weight="bold">0.40 kg</text><text x="75" y="339" text-anchor="middle" font-size="15">Upper only</text><text x="75" y="359" text-anchor="middle" font-size="14">b = 13⅓ cm</text></g><g transform="translate(182 0)"><rect x="0" y="110" width="150" height="68" fill="#e8efcf"/><rect x="0" y="178" width="150" height="141" fill="#dce7f5"/><path d="M0 95V319H150V95M0 110H150M0 178H150" stroke="#3a6a92" stroke-width="2" fill="none"/><rect x="58" y="76" width="39" height="136" rx="3" fill="#d7f0e7" stroke="#167a6e" stroke-width="2.5"/><text x="75" y="15" text-anchor="middle" font-weight="bold">1.10 kg</text><text x="75" y="339" text-anchor="middle" font-size="15">Partly emerged</text><text x="75" y="359" text-anchor="middle" font-size="14">b = 30 cm</text></g><g transform="translate(352 0)"><rect x="0" y="110" width="150" height="68" fill="#e8efcf"/><rect x="0" y="178" width="150" height="141" fill="#dce7f5"/><path d="M0 95V319H150V95M0 110H150M0 178H150" stroke="#3a6a92" stroke-width="2" fill="none"/><rect x="58" y="144" width="39" height="136" rx="3" fill="#d7f0e7" stroke="#167a6e" stroke-width="2.5"/><text x="75" y="15" text-anchor="middle" font-weight="bold">1.80 kg</text><text x="75" y="339" text-anchor="middle" font-size="15">Fully immersed</text><text x="75" y="359" text-anchor="middle" font-size="14">t = 10 cm</text></g><g transform="translate(522 0)"><rect x="0" y="110" width="150" height="68" fill="#e8efcf"/><rect x="0" y="178" width="150" height="141" fill="#dce7f5"/><path d="M0 95V319H150V95M0 110H150M0 178H150" stroke="#3a6a92" stroke-width="2" fill="none"/><rect x="58" y="178" width="39" height="136" rx="3" fill="#d7f0e7" stroke="#167a6e" stroke-width="2.5"/><text x="75" y="15" text-anchor="middle" font-weight="bold">2.10 kg</text><text x="75" y="339" text-anchor="middle" font-size="15">No equilibrium</text><text x="75" y="359" text-anchor="middle" font-size="14">Weight > buoyancy</text><path d="M118 233V282" stroke="#a75a2c" stroke-width="3" marker-end="url(#arr)"/></g></g></svg>
