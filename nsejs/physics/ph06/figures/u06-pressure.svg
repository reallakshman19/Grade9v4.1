<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" role="img" aria-labelledby="title desc">
<title id="title">Pressure resultant on an immersed rectangular block</title><desc id="desc">Water pressure on the bottom exceeds pressure on top. Opposite horizontal forces cancel.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs>
<rect width="660" height="390" fill="#fbfefe"/><g font-family="Arial,sans-serif" font-size="19" fill="#174858"><rect x="34" y="64" width="365" height="284" fill="#dce7f5"/><path d="M34 48V348H399V48M34 64H399" stroke="#3a6a92" stroke-width="3" fill="none"/><text x="45" y="54">free surface</text><rect x="152" y="151" width="120" height="104" rx="3" fill="#d7f0e7" stroke="#167a6e" stroke-width="3"/><path d="M212 94V146" stroke="#ca894c" stroke-width="4" marker-end="url(#arr)"/><path d="M212 333V261" stroke="#167a6e" stroke-width="5" marker-end="url(#arr)"/><path d="M101 203H146M323 203H278" stroke="#3a6a92" stroke-width="3" marker-end="url(#arr)"/><text x="223" y="109">pₜ A</text><text x="225" y="322">pᵦ A</text><text x="176" y="183">area A</text><path d="M302 151H326M302 255H326M320 151V255" stroke="#526e7d" stroke-width="2" fill="none"/><text x="333" y="210">h</text><text x="420" y="104" font-weight="bold">Vertical forces</text><text x="420" y="143">Fᵦ = A(pᵦ − pₜ)</text><text x="420" y="181">pᵦ − pₜ = ρgh</text><text x="420" y="224">Fᵦ = ρgAh</text><text x="420" y="267">= ρgV</text><text x="420" y="315" font-size="16">Uniform liquid,</text><text x="420" y="338" font-size="16">static pressure field.</text></g></svg>
