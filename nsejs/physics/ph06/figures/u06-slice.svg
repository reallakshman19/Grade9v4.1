<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="title desc"><title id="title">Hydrostatic slice force balance</title><desc id="desc">Vertical forces on a horizontal slice of liquid</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><g font-family="Arial,sans-serif" fill="#174858" font-size="17"><rect x="25" y="48" width="275" height="220" rx="5" fill="#dce7f5"/><rect x="80" y="119" width="164" height="45" fill="#d7f0e7" stroke="#167a6e" stroke-width="3"/><path d="M140 61V115M178 145V203" stroke="#a75a2c" stroke-width="3" marker-end="url(#arr)" fill="none"/><path d="M140 242V168" stroke="#167a6e" stroke-width="4" marker-end="url(#arr)" fill="none"/><text x="155" y="82">pₜA</text><text x="187" y="196">ρAΔh g</text><text x="155" y="238">pᵦA</text><path d="M260 119H279M260 164H279M270 119V164" stroke="#587e91" stroke-width="2"/><text x="285" y="148">Δh</text><text x="85" y="146">area A</text><text x="330" y="72" font-weight="bold">Static vertical balance</text><text x="330" y="119">pᵦA − pₜA − ρAΔh g = 0</text><text x="330" y="164">pᵦ − pₜ = ρgΔh</text><text x="330" y="209">kg/m³ × m/s² × m = Pa</text><text x="330" y="254">Depth positive down.</text></g></svg>
