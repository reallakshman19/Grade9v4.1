<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%" style="background:#ffffff; border:1.5px solid #cbd5e1; border-radius:10px;">

  <style>
    .wire { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash-wire { stroke: #64748b; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
    .res-box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 4; }
    .res-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    .node-pt { fill: #1e293b; }
    .term-pt { fill: #ea580c; stroke: #9a3412; stroke-width: 2; }
    .term-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #c2410c; text-anchor: middle; dominant-baseline: central; }
    .node-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    .diag-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .diag-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
  </style>

  <text x="270" y="30" class="diag-title">Fig. 17: Infinite Resistor Ladder Network</text>
  <text x="270" y="50" class="diag-sub">Series R_s = 4 &#937; &#183; Shunt R_p = 3 &#937; &#183; Repeated indefinitely to infinity</text>

  <!-- Rails: Top y=120, Bottom y=220 -->
  <!-- Terminals A & B -->
  <line x1="40" y1="120" x2="80" y2="120" class="wire"/>
  <circle cx="40" cy="120" r="7" class="term-pt"/>
  <text x="40" y="95" class="term-lbl">A</text>

  <line x1="40" y1="220" x2="460" y2="220" class="wire"/>
  <circle cx="40" cy="220" r="7" class="term-pt"/>
  <text x="40" y="245" class="term-lbl">B</text>

  <!-- Cell 1 -->
  <rect x="80" y="106" width="70" height="28" class="res-box"/>
  <text x="115" y="120" class="res-lbl">4 &#937;</text>
  <line x1="150" y1="120" x2="200" y2="120" class="wire"/>
  <circle cx="200" cy="120" r="4" class="node-pt"/>

  <line x1="200" y1="120" x2="200" y2="220" class="wire"/>
  <rect x="186" y="145" width="28" height="60" class="res-box"/>
  <text x="200" y="175" class="res-lbl">3 &#937;</text>
  <circle cx="200" cy="220" r="4" class="node-pt"/>

  <!-- Cell 2 -->
  <line x1="200" y1="120" x2="240" y2="120" class="wire"/>
  <rect x="240" y="106" width="70" height="28" class="res-box"/>
  <text x="275" y="120" class="res-lbl">4 &#937;</text>
  <line x1="310" y1="120" x2="360" y2="120" class="wire"/>
  <circle cx="360" cy="120" r="4" class="node-pt"/>

  <line x1="360" y1="120" x2="360" y2="220" class="wire"/>
  <rect x="346" y="145" width="28" height="60" class="res-box"/>
  <text x="360" y="175" class="res-lbl">3 &#937;</text>
  <circle cx="360" cy="220" r="4" class="node-pt"/>

  <!-- Cell 3 leading to ... -->
  <line x1="360" y1="120" x2="400" y2="120" class="wire"/>
  <rect x="400" y="106" width="70" height="28" class="res-box"/>
  <text x="435" y="120" class="res-lbl">4 &#937;</text>
  <line x1="470" y1="120" x2="500" y2="120" class="wire"/>

  <line x1="460" y1="220" x2="500" y2="220" class="wire"/>

  <!-- Infinity dots -->
  <text x="515" y="125" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#64748b">&#8943;</text>
  <text x="515" y="225" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#64748b">&#8943;</text>
  <text x="480" y="175" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">to &#8734;</text>

  <text x="270" y="260" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#059669" text-anchor="middle">Recursive: R = 4 + (3R)/(3+R) &#8658; R&#178; - 4R - 12 = 0 &#8658; (R - 6)(R + 2) = 0 &#8658; R_AB = 6 &#937;</text>
</svg>
