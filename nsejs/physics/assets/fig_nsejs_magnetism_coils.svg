<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:8px;">
  <!-- Title -->
  <text x="380" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Lenz's Law · Induced Current in Conducting Coils (Viewed from +X Axis)</text>
  <text x="380" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Coils lie in the Y-Z plane · Magnet velocity v along the X axis</text>

  <!-- Panel 1: (i) -->
  <g transform="translate(20, 65)">
    <rect width="165" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Diagram (i)</text>
    <!-- Coil -->
    <ellipse cx="120" cy="90" rx="14" ry="42" fill="none" stroke="#2563eb" stroke-width="3"/>
    <!-- Current Direction: Anticlockwise (upwards on front edge) -->
    <path d="M 120 48 L 120 54 M 116 52 L 120 48 L 124 52" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    <!-- Magnet: Approaching N Pole -->
    <rect x="25" y="76" width="35" height="28" fill="#ef4444"/>
    <text x="42" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <rect x="60" y="76" width="35" height="28" fill="#3b82f6"/>
    <text x="77" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <text x="100" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">→ v</text>
    <text x="82" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#16a34a" font-weight="600" text-anchor="middle">N-pole moves right →</text>
    <text x="82" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Induced: Anticlockwise</text>
  </g>

  <!-- Panel 2: (ii) -->
  <g transform="translate(205, 65)">
    <rect width="165" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Diagram (ii)</text>
    <!-- Coil -->
    <ellipse cx="45" cy="90" rx="14" ry="42" fill="none" stroke="#2563eb" stroke-width="3"/>
    <!-- Current Direction: Anticlockwise (upwards on front edge) -->
    <path d="M 45 48 L 45 54 M 41 52 L 45 48 L 49 52" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    <!-- Magnet: Receding S Pole -->
    <rect x="75" y="76" width="35" height="28" fill="#ef4444"/>
    <text x="92" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <rect x="110" y="76" width="35" height="28" fill="#3b82f6"/>
    <text x="127" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <text x="135" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">→ v</text>
    <text x="82" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#16a34a" font-weight="600" text-anchor="middle">S-pole recedes right →</text>
    <text x="82" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Induced: Anticlockwise</text>
  </g>

  <!-- Panel 3: (iii) -->
  <g transform="translate(390, 65)">
    <rect width="165" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Diagram (iii)</text>
    <!-- Coil -->
    <ellipse cx="120" cy="90" rx="14" ry="42" fill="none" stroke="#2563eb" stroke-width="3"/>
    <!-- Current Direction: Clockwise (downwards on front edge) -->
    <path d="M 120 132 L 120 126 M 116 128 L 120 132 L 124 128" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    <!-- Magnet: Approaching N Pole -->
    <rect x="25" y="76" width="35" height="28" fill="#ef4444"/>
    <text x="42" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <rect x="60" y="76" width="35" height="28" fill="#3b82f6"/>
    <text x="77" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <text x="100" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">→ v</text>
    <text x="82" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="600" text-anchor="middle">N-pole moves right →</text>
    <text x="82" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">Shows: Clockwise (✕)</text>
  </g>

  <!-- Panel 4: (iv) -->
  <g transform="translate(575, 65)">
    <rect width="165" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="82" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Diagram (iv)</text>
    <!-- Coil -->
    <ellipse cx="120" cy="90" rx="14" ry="42" fill="none" stroke="#2563eb" stroke-width="3"/>
    <!-- Current Direction: Clockwise (downwards on front edge) -->
    <path d="M 120 132 L 120 126 M 116 128 L 120 132 L 124 128" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    <!-- Magnet: Approaching S Pole -->
    <rect x="25" y="76" width="35" height="28" fill="#3b82f6"/>
    <text x="42" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <rect x="60" y="76" width="35" height="28" fill="#ef4444"/>
    <text x="77" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <text x="100" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a">→ v</text>
    <text x="82" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#16a34a" font-weight="600" text-anchor="middle">S-pole moves right →</text>
    <text x="82" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">Induced: Clockwise</text>
  </g>
</svg>
