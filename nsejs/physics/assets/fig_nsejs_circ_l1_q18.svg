<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 640 360" role="img" aria-label="Wheatstone bridge resistor network. Four outer arms: AC 2 ohms, CB 4 ohms, AD 3 ohms, DB 6 ohms; central CD 5 ohms. Terminals A and B.">
<title>Level-1 Fig. 6: Resistor bridge network</title>
<desc>Neutral reconstruction of the owner-supplied worksheet. Nodes A, B, C and D. Resistors 2 ohms between A and C, 4 ohms between C and B, 3 ohms between A and D, 6 ohms between D and B, and 5 ohms between C and D. Topology: AC 2 ohms; CB 4 ohms; AD 3 ohms; DB 6 ohms; CD 5 ohms. No solution is displayed. Source figure comparison pending independent review.</desc>
