<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="100%" height="100%" style="background:#ffffff; border:1.5px solid #cbd5e1; border-radius:10px;">

  <style>
    .wire { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash-wire { stroke: #64748b; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
    .res-box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 4; }
    .res-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    .node-pt { fill: #1e293b; }
    .term-pt { fill: #ea580c; stroke: #9a3412; stroke-width: 2; }
    .term-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #c2410c; text-anchor: middle; dominant-baseline: central; }
    .node-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    .diag-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .diag-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
  </style>

  <text x="260" y="30" class="diag-title">Fig. 2: Series-Parallel Resistor Combination</text>
  <text x="260" y="50" class="diag-sub">Find equivalent resistance between A and B</text>

  <!-- Terminal A -->
  <line x1="50" y1="150" x2="100" y2="150" class="wire"/>
  <circle cx="50" cy="150" r="7" class="term-pt"/>
  <text x="50" y="125" class="term-lbl">A</text>

  <!-- Series 2 ohm -->
  <rect x="100" y="136" width="75" height="28" class="res-box"/>
  <text x="137" y="150" class="res-lbl">2 &#937;</text>
  <line x1="175" y1="150" x2="230" y2="150" class="wire"/>
  <circle cx="230" cy="150" r="4" class="node-pt"/>

  <!-- Parallel bus left -->
  <line x1="230" y1="100" x2="230" y2="200" class="wire"/>
  <circle cx="230" cy="100" r="4" class="node-pt"/>
  <circle cx="230" cy="200" r="4" class="node-pt"/>

  <!-- Top parallel branch: 3 ohm -->
  <line x1="230" y1="100" x2="290" y2="100" class="wire"/>
  <rect x="290" y="86" width="75" height="28" class="res-box"/>
  <text x="327" y="100" class="res-lbl">3 &#937;</text>
  <line x1="365" y1="100" x2="425" y2="100" class="wire"/>

  <!-- Bottom parallel branch: 4 ohm + 2 ohm -->
  <line x1="230" y1="200" x2="260" y2="200" class="wire"/>
  <rect x="260" y="186" width="65" height="28" class="res-box"/>
  <text x="292" y="200" class="res-lbl">4 &#937;</text>
  <line x1="325" y1="200" x2="350" y2="200" class="wire"/>
  <rect x="350" y="186" width="65" height="28" class="res-box"/>
  <text x="382" y="200" class="res-lbl">2 &#937;</text>
  <line x1="415" y1="200" x2="425" y2="200" class="wire"/>

  <!-- Parallel bus right -->
  <line x1="425" y1="100" x2="425" y2="200" class="wire"/>
  <circle cx="425" cy="150" r="4" class="node-pt"/>
  <circle cx="425" cy="100" r="4" class="node-pt"/>
  <circle cx="425" cy="200" r="4" class="node-pt"/>

  <!-- Terminal B -->
  <line x1="425" y1="150" x2="475" y2="150" class="wire"/>
  <circle cx="475" cy="150" r="7" class="term-pt"/>
  <text x="475" y="125" class="term-lbl">B</text>
</svg>
