<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-labelledby="title desc"><title id="title">Uniform gravity: torque-equivalent weight</title><desc id="desc">Guided example: masses two and four kilograms, at zero and three metres, uniform field.</desc><rect width="420" height="210" fill="#fbfefe"/><g font-family="Arial,sans-serif" font-size="16" fill="#174858"><path d="M65 84H355" stroke="#587e91" stroke-width="5"/><rect x="40" y="45" width="50" height="36" rx="5" fill="#d7f0e7" stroke="#167a6e" stroke-width="2"/><rect x="315" y="34" width="80" height="47" rx="5" fill="#dce7f5" stroke="#3a6a92" stroke-width="2"/><text x="65" y="69" text-anchor="middle">2 kg</text><text x="355" y="63" text-anchor="middle">4 kg</text><path d="M65 86V121m-7 -8 7 8 7 -8M355 86V153m-7 -8 7 8 7 -8" stroke="#167a6e" stroke-width="3" fill="none"/><text x="80" y="117">20 N</text><text x="295" y="151">40 N</text><path d="M65 165V177H355V165" stroke="#91aab9" stroke-width="2" fill="none"/><text x="65" y="198" text-anchor="middle">0 m</text><text x="355" y="198" text-anchor="middle">3 m</text><path d="M258.33 85V158" stroke="#ca894c" stroke-width="3" stroke-dasharray="5 4"/><text x="258" y="24" text-anchor="middle">x = 2 m</text><text x="207" y="174" text-anchor="middle" font-size="14">uniform g = 10 N/kg</text></g></svg>
