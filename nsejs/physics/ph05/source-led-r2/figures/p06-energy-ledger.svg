<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-labelledby="title desc"><title id="title">Two-body energy ledger</title><desc id="desc">Guided example with 12 joules released; 8 and 4 joules gained.</desc><rect width="420" height="210" fill="#fbfefe"/><g font-family="Arial, sans-serif"><text x="210" y="24" font-size="16" text-anchor="middle" fill="#174858">Energy released = 12 J</text><rect x="55" y="53" width="310" height="27" rx="5" fill="#dce7f5" stroke="#3a6a92" stroke-width="2"/><text x="210" y="72" font-size="16" text-anchor="middle" fill="#174858">12 J potential-energy decrease</text><path d="M210 85 L210 112" stroke="#167a6e" stroke-width="3" fill="none"/><path d="M210 112 l-5.226872289306592 -8.525245220595057 M210 112 l5.2268722893065895 -8.525245220595059" stroke="#167a6e" stroke-width="3" fill="none"/><rect x="55" y="126" width="206" height="32" rx="5" fill="#d7f0e7" stroke="#167a6e" stroke-width="2"/><rect x="261" y="126" width="104" height="32" rx="5" fill="#dce7f5" stroke="#3a6a92" stroke-width="2"/><text x="158" y="147" font-size="16" text-anchor="middle" fill="#174858">8 J · m</text><text x="313" y="147" font-size="16" text-anchor="middle" fill="#174858">4 J · 2m</text><text x="210" y="189" font-size="16" text-anchor="middle" fill="#174858">Both kinetic-energy terms count</text></g></svg>
