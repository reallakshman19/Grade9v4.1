<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" role="img" aria-labelledby="title desc">
<title id="title">Third-law impulses on different bodies</title><desc id="desc">Original teaching diagram showing the physics system, a signed convention and an explicit model assumption.</desc>
<defs><marker id="arr" markerWidth="12" markerHeight="9" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,4 L0,8 Z" fill="#096a67"/></marker></defs>
<rect width="940" height="345" rx="18" fill="#fbfdff" stroke="#c6dae4"/>
<text x="30" y="38" font-size="22" font-weight="600" fill="#1d506e" text-anchor="start">PH03-P04 · GUIDE · Third-law impulses on different bodies</text>
<line x1="30" y1="56" x2="910" y2="56" stroke="#bed2df" stroke-width="2" />
<rect x="95" y="87" width="745" height="220" rx="22" fill="none" stroke="#3c7b93" stroke-width="3" stroke-dasharray="10 8"/><text x="110" y="109" font-size="18" font-weight="600" fill="#3c7b93" text-anchor="start">SYSTEM: A + B</text><rect x="195" y="164" width="190" height="82" rx="9" fill="#e0f2ef" stroke="#42677b" stroke-width="2.2"/><text x="222" y="195" font-size="20" font-weight="600" fill="#183c50" text-anchor="start">A · 3 kg</text><text x="222" y="228" font-size="20" font-weight="600" fill="#183c50" text-anchor="start">J = +6 N·s</text><rect x="560" y="164" width="190" height="82" rx="9" fill="#fff0dc" stroke="#42677b" stroke-width="2.2"/><text x="585" y="195" font-size="20" font-weight="600" fill="#183c50" text-anchor="start">B · 1 kg</text><text x="585" y="228" font-size="20" font-weight="600" fill="#183c50" text-anchor="start">J = −6 N·s</text><line x1="315" y1="140" x2="445" y2="140" stroke="#096a67" stroke-width="4" marker-end="url(#arr)"/><text x="380" y="127" font-size="18" font-weight="600" fill="#096a67" text-anchor="middle">+J on A</text><line x1="645" y1="140" x2="535" y2="140" stroke="#096a67" stroke-width="4" marker-end="url(#arr)"/><text x="590" y="127" font-size="18" font-weight="600" fill="#096a67" text-anchor="middle">−J on B</text><text x="150" y="285" font-size="18" font-weight="600" fill="#315d71" text-anchor="start">Equal opposite impulse; unequal speeds for unequal masses.</text>
