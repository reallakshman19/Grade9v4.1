<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" role="img" aria-labelledby="title desc">
<title id="title">Signed momentum versus kinetic energy</title><desc id="desc">Original teaching diagram showing the physics system, a signed convention and an explicit model assumption.</desc>
<defs><marker id="arr" markerWidth="12" markerHeight="9" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,4 L0,8 Z" fill="#096a67"/></marker></defs>
<rect width="940" height="345" rx="18" fill="#fbfdff" stroke="#c6dae4"/>
<text x="30" y="38" font-size="22" font-weight="600" fill="#1d506e" text-anchor="start">PH03-P01 · GUIDE · Signed momentum versus kinetic energy</text>
<line x1="30" y1="56" x2="910" y2="56" stroke="#bed2df" stroke-width="2" />
<text x="34" y="91" font-size="18" font-weight="600" fill="#2f596f" text-anchor="start">RIGHT IS POSITIVE  (+)</text><line x1="45" y1="262" x2="885" y2="262" stroke="#526d7c" stroke-width="4" /><rect x="130" y="174" width="220" height="78" rx="9" fill="#e0f2ef" stroke="#42677b" stroke-width="2.2"/><text x="150" y="207" font-size="20" font-weight="600" fill="#183c50" text-anchor="start">A: 4 kg</text><text x="150" y="238" font-size="20" font-weight="600" fill="#183c50" text-anchor="start">−2 m/s</text><rect x="605" y="174" width="220" height="78" rx="9" fill="#fff1d9" stroke="#42677b" stroke-width="2.2"/><text x="625" y="207" font-size="20" font-weight="600" fill="#183c50" text-anchor="start">B: 6 kg</text><text x="625" y="238" font-size="20" font-weight="600" fill="#183c50" text-anchor="start">+1 m/s</text><line x1="310" y1="150" x2="140" y2="150" stroke="#096a67" stroke-width="4" marker-end="url(#arr)"/><text x="225" y="137" font-size="18" font-weight="600" fill="#096a67" text-anchor="middle">Leftward</text><line x1="650" y1="150" x2="785" y2="150" stroke="#096a67" stroke-width="4" marker-end="url(#arr)"/><text x="717.5" y="137" font-size="18" font-weight="600" fill="#096a67" text-anchor="middle">Rightward</text><text x="45" y="313" font-size="18" font-weight="600" fill="#315d71" text-anchor="start">Signed momentum can be negative; kinetic energy remains nonnegative.</text>
</svg>
