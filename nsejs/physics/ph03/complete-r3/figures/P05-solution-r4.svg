<text x="499" y="159" font-size="18" fill="#153449">Load v LAB = V_platform + 5</text>
<text x="499" y="193" font-size="18" fill="#153449">8V + 2(V + 5) = 10</text>
<text x="499" y="227" font-size="18" fill="#153449">V_platform = 0; load LAB = +5</text>
<text x="499" y="261" font-size="18" fill="#153449">Centre-of-mass v = +1 m/s</text>
