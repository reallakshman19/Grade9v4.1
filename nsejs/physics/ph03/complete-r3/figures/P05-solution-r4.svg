<text x="41" y="93" font-size="19" font-weight="700" fill="#17435a">Given physical conditions</text>
<text x="499" y="93" font-size="19" font-weight="700" fill="#17435a">Checked result</text>
<text x="41" y="125" font-size="18" fill="#153449">Platform 8 kg; load 2 kg</text>
<text x="41" y="159" font-size="18" fill="#153449">Both initially +1 m/s LAB</text>
<text x="41" y="193" font-size="18" fill="#153449">Load ejected +5 m/s relative</text>
