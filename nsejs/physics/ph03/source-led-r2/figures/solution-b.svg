<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Impulse and energy at different times</title><desc id="desc">In the changed chronology, momentum 8 then 8 then 4; kinetic energy 26 then 8 then 2 joules.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#176b62"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#b35b34"/></marker></defs><style>text{font:18px system-ui,sans-serif;fill:#19384b}.title{font-weight:bold;font-size:22px}.a{fill:#e1eff7;stroke:#315c78;stroke-width:2.5}.b{fill:#dff3e9;stroke:#176b62;stroke-width:2.5}.arrow{stroke:#176b62;stroke-width:3;marker-end:url(#a);fill:none}.force{stroke:#b35b34;stroke-width:3;marker-end:url(#r);fill:none}.line{stroke:#668294;stroke-width:2.5;fill:none}.dash{stroke:#8296a0;stroke-dasharray:5 5;fill:none}</style><rect width="760" height="330" fill="#fcfefe"/><text x="24" y="32" text-anchor="start" class="title">Boundary chronology: contact then external impulse</text><rect x="20" y="70" width="220" height="135" rx="8" class="a"/><text x="130" y="100" text-anchor="middle">Before</text><text x="130" y="143" text-anchor="middle">P = 8 kg·m/s</text><text x="130" y="181" text-anchor="middle">K = 26 J</text><rect x="270" y="70" width="220" height="135" rx="8" class="b"/><text x="380" y="100" text-anchor="middle">Latched</text><text x="380" y="143" text-anchor="middle">P = 8 kg·m/s</text><text x="380" y="181" text-anchor="middle">K = 8 J</text><rect x="520" y="70" width="220" height="135" rx="8" class="a"/><text x="630" y="100" text-anchor="middle">After impulse</text><text x="630" y="143" text-anchor="middle">P = 4 kg·m/s</text><text x="630" y="181" text-anchor="middle">K = 2 J</text><text x="24" y="249" text-anchor="start">Isolated contact: 18 J converted</text><text x="410" y="249" text-anchor="start">Later: 6 J decrease</text><text x="24" y="290" text-anchor="start">Sensor timing is part of the physical model.</text></svg>
