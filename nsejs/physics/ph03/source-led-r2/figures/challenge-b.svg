<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Sensor observation of latching collision</title><desc id="desc">Two 2 kg blocks approach with signed velocities +5 and −1 metres per second. The sensor reports +1 metre per second after contact.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#176b62"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#b35b34"/></marker></defs><style>text{font:18px system-ui,sans-serif;fill:#19384b}.title{font-weight:bold;font-size:22px}.a{fill:#e1eff7;stroke:#315c78;stroke-width:2.5}.b{fill:#dff3e9;stroke:#176b62;stroke-width:2.5}.arrow{stroke:#176b62;stroke-width:3;marker-end:url(#a);fill:none}.force{stroke:#b35b34;stroke-width:3;marker-end:url(#r);fill:none}.line{stroke:#668294;stroke-width:2.5;fill:none}.dash{stroke:#8296a0;stroke-dasharray:5 5;fill:none}</style><rect width="760" height="330" fill="#fcfefe"/><text x="24" y="32" text-anchor="start" class="title">Before contact</text><rect x="110" y="100" width="130" height="48" rx="5" class="a"/><text x="175" y="130" text-anchor="middle">2 kg</text><rect x="520" y="100" width="130" height="48" rx="5" class="b"/><text x="585" y="130" text-anchor="middle">2 kg</text><path d="M125 83H225" class="arrow"/><text x="175" y="68" text-anchor="middle">+5 m/s</text><path d="M635 83H535" class="arrow"/><text x="585" y="68" text-anchor="middle">−1 m/s</text><path d="M25 153H735" class="line"/><text x="24" y="192" text-anchor="start" class="title">Sensor at the reported instant</text><rect x="270" y="240" width="100" height="48" rx="5" class="a"/><text x="320" y="270" text-anchor="middle">A</text><rect x="370" y="240" width="100" height="48" rx="5" class="b"/><text x="420" y="270" text-anchor="middle">B</text><path d="M295 222H430" class="arrow"/><text x="360" y="211" text-anchor="middle">+1 m/s</text><path d="M25 290H735" class="line"/></svg>
