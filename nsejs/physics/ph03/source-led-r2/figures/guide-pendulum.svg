<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">An ideal pendulum after launch</title><desc id="desc">A 2 kg pendulum bob is already moving at the bottom, then rises until momentarily at rest. Tension is radial; the height is vertical, not arc length.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#176b62"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#b35b34"/></marker></defs><style>text{font:18px system-ui,sans-serif;fill:#19384b}.title{font-weight:bold;font-size:22px}.a{fill:#e1eff7;stroke:#315c78;stroke-width:2.5}.b{fill:#dff3e9;stroke:#176b62;stroke-width:2.5}.arrow{stroke:#176b62;stroke-width:3;marker-end:url(#a);fill:none}.force{stroke:#b35b34;stroke-width:3;marker-end:url(#r);fill:none}.line{stroke:#668294;stroke-width:2.5;fill:none}.dash{stroke:#8296a0;stroke-dasharray:5 5;fill:none}</style><rect width="760" height="390" fill="#fcfefe"/><text x="25" y="32" text-anchor="start" class="title">After launch: a different system and force history</text><path d="M275 65H485" class="line"/><circle cx="380" cy="65" r="5" fill="#19384b"/><path d="M380 65V305" class="line"/><path d="M380 65L588 185" class="line"/><path d="M380 305 A240 240 0 0 0 588 185" class="dash"/><circle cx="380" cy="305" r="20" class="a"/><circle cx="588" cy="185" r="20" class="b"/><path d="M405 305H494" class="arrow"/><text x="450" y="289" text-anchor="middle">2 m/s</text><path d="M565 171L514 142" class="force"/><text x="505" y="126" text-anchor="start">T toward pivot</text><path d="M588 205V263" class="force"/><text x="606" y="260" text-anchor="start">mg</text><path d="M608 185H704M400 305H704" class="dash"/><path d="M700 185V305M691 185H709M691 305H709" class="line"/><text x="713" y="251" text-anchor="start">h</text><text x="25" y="348" text-anchor="start">Vertical rise h = 0.20 m · schematic; not arc length.</text><text x="25" y="375" text-anchor="start">T is perpendicular to instantaneous motion; gravity changes K.</text></svg>
