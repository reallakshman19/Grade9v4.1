<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Internal impulses cancel</title><desc id="desc">Two blocks on a horizontal track; equal opposite contact forces act on different blocks. The system boundary encloses both.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#176b62"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#b35b34"/></marker></defs><style>text{font:18px system-ui,sans-serif;fill:#19384b}.title{font-weight:bold;font-size:22px}.a{fill:#e1eff7;stroke:#315c78;stroke-width:2.5}.b{fill:#dff3e9;stroke:#176b62;stroke-width:2.5}.arrow{stroke:#176b62;stroke-width:3;marker-end:url(#a);fill:none}.force{stroke:#b35b34;stroke-width:3;marker-end:url(#r);fill:none}.line{stroke:#668294;stroke-width:2.5;fill:none}.dash{stroke:#8296a0;stroke-dasharray:5 5;fill:none}</style><rect width="760" height="330" fill="#fcfefe"/><text x="25" y="32" text-anchor="start" class="title">One interaction, two changes of momentum</text><rect x="100" y="64" width="560" height="204" rx="15" class="dash"/><text x="380" y="87" text-anchor="middle">System = A + B</text><rect x="210" y="135" width="170" height="48" rx="5" class="a"/><text x="295" y="165" text-anchor="middle">A · 1 kg</text><rect x="380" y="135" width="170" height="48" rx="5" class="b"/><text x="465" y="165" text-anchor="middle">B · 4 kg</text><path d="M342 120H232" class="force"/><path d="M418 120H528" class="force"/><text x="282" y="108" text-anchor="middle">F on A</text><text x="478" y="108" text-anchor="middle">F on B</text><path d="M125 185H635" class="line"/><text x="380" y="219" text-anchor="middle">ΔpA = −5 N·s    ·    ΔpB = +5 N·s</text><text x="380" y="247" text-anchor="middle">ΔPsystem = 0 if external horizontal impulse is zero</text></svg>
