<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Signed state and kinetic energy ledger</title><desc id="desc">Solved state sequence: total momentum minus ten before and after contact, zero at stop; kinetic energies 43.75, 10, and zero joules.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#176b62"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#b35b34"/></marker></defs><style>text{font:18px system-ui,sans-serif;fill:#19384b}.title{font-weight:bold;font-size:22px}.a{fill:#e1eff7;stroke:#315c78;stroke-width:2.5}.b{fill:#dff3e9;stroke:#176b62;stroke-width:2.5}.arrow{stroke:#176b62;stroke-width:3;marker-end:url(#a);fill:none}.force{stroke:#b35b34;stroke-width:3;marker-end:url(#r);fill:none}.line{stroke:#668294;stroke-width:2.5;fill:none}.dash{stroke:#8296a0;stroke-dasharray:5 5;fill:none}</style><rect width="760" height="330" fill="#fcfefe"/><text x="24" y="32" text-anchor="start" class="title">Three states: keep the two transitions separate</text><rect x="20" y="70" width="220" height="135" rx="8" class="a"/><text x="130" y="100" text-anchor="middle">Before impact</text><text x="130" y="143" text-anchor="middle">P = −10 kg·m/s</text><text x="130" y="181" text-anchor="middle">K = 43.75 J</text><rect x="270" y="70" width="220" height="135" rx="8" class="b"/><text x="380" y="100" text-anchor="middle">After impact</text><text x="380" y="143" text-anchor="middle">P = −10 kg·m/s</text><text x="380" y="181" text-anchor="middle">K = 10 J</text><rect x="520" y="70" width="220" height="135" rx="8" class="a"/><text x="630" y="100" text-anchor="middle">At rest</text><text x="630" y="143" text-anchor="middle">P = 0</text><text x="630" y="181" text-anchor="middle">K = 0</text><text x="24" y="241" text-anchor="start">Impact conversion: 33.75 J</text><text x="410" y="241" text-anchor="start">Braking conversion: 10 J</text><path d="M240 221H267" class="arrow"/><path d="M490 221H517" class="arrow"/><text x="24" y="290" text-anchor="start">43.75 J = 33.75 J + 10 J; friction impulse acts after contact.</text></svg>
