<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Energy ledger of opposing collision</title><desc id="desc">Initial 33 joules are divided into 3.6 joules of kinetic energy and 29.4 joules of internal conversion.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#176b62"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#b35b34"/></marker></defs><style>text{font:18px system-ui,sans-serif;fill:#19384b}.title{font-weight:bold;font-size:22px}.a{fill:#e1eff7;stroke:#315c78;stroke-width:2.5}.b{fill:#dff3e9;stroke:#176b62;stroke-width:2.5}.arrow{stroke:#176b62;stroke-width:3;marker-end:url(#a);fill:none}.force{stroke:#b35b34;stroke-width:3;marker-end:url(#r);fill:none}.line{stroke:#668294;stroke-width:2.5;fill:none}.dash{stroke:#8296a0;stroke-dasharray:5 5;fill:none}</style><rect width="760" height="330" fill="#fcfefe"/><text x="24" y="32" text-anchor="start" class="title">Energy ledger: same 3 kg and 2 kg example</text><text x="24" y="74" text-anchor="start">Before contact: 33 J</text><rect x="24" y="88" width="660" height="54" fill="#315c78" rx="4"/><text x="24" y="187" text-anchor="start">After contact: 3.6 J kinetic + 29.4 J converted</text><rect x="24" y="200" width="72" height="55" fill="#176b62"/><rect x="96" y="200" width="588" height="55" fill="#e6a865"/><text x="60" y="234" text-anchor="middle">3.6</text><text x="390" y="234" text-anchor="middle">29.4 J · deformation, heat, sound</text><text x="24" y="303" text-anchor="start">The total energy is accounted for; kinetic energy is not conserved.</text></svg>
