<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">Opposing motion and signed momentum</title><desc id="desc">A 3 kg block moves right at 4 m/s and a 2 kg block moves left at 3 m/s; after latching their combined velocity is rightward.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#176b62"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#b35b34"/></marker></defs><style>text{font:18px system-ui,sans-serif;fill:#19384b}.title{font-weight:bold;font-size:22px}.a{fill:#e1eff7;stroke:#315c78;stroke-width:2.5}.b{fill:#dff3e9;stroke:#176b62;stroke-width:2.5}.arrow{stroke:#176b62;stroke-width:3;marker-end:url(#a);fill:none}.force{stroke:#b35b34;stroke-width:3;marker-end:url(#r);fill:none}.line{stroke:#668294;stroke-width:2.5;fill:none}.dash{stroke:#8296a0;stroke-dasharray:5 5;fill:none}</style><rect width="760" height="370" fill="#fcfefe"/><text x="24" y="30" text-anchor="start" class="title">Before contact</text><rect x="110" y="104" width="125" height="48" rx="5" class="a"/><text x="172.5" y="134" text-anchor="middle">3 kg</text><rect x="510" y="104" width="125" height="48" rx="5" class="b"/><text x="572.5" y="134" text-anchor="middle">2 kg</text><path d="M125 85H220" class="arrow"/><path d="M620 85H525" class="arrow"/><text x="172" y="70" text-anchor="middle">+4 m/s</text><text x="572" y="70" text-anchor="middle">−3 m/s</text><path d="M30 155H730" class="line"/><text x="24" y="185" text-anchor="start" class="title">Immediately after contact</text><rect x="255" y="260" width="125" height="48" rx="5" class="a"/><text x="317.5" y="290" text-anchor="middle">3 kg</text><rect x="380" y="260" width="125" height="48" rx="5" class="b"/><text x="442.5" y="290" text-anchor="middle">2 kg</text><path d="M330 242H435" class="arrow"/><text x="382" y="229" text-anchor="middle">+1.2 m/s</text><path d="M30 309H730" class="line"/><text x="380" y="343" text-anchor="middle">P = +12 − 6 = +6 kg·m/s; common mass = 5 kg</text></svg>
