<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Braking force and energy</title><desc id="desc">A 4 kg sliding body moves right on a rough horizontal surface; friction points left and the body stops after four metres.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#176b62"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#b35b34"/></marker></defs><style>text{font:18px system-ui,sans-serif;fill:#19384b}.title{font-weight:bold;font-size:22px}.a{fill:#e1eff7;stroke:#315c78;stroke-width:2.5}.b{fill:#dff3e9;stroke:#176b62;stroke-width:2.5}.arrow{stroke:#176b62;stroke-width:3;marker-end:url(#a);fill:none}.force{stroke:#b35b34;stroke-width:3;marker-end:url(#r);fill:none}.line{stroke:#668294;stroke-width:2.5;fill:none}.dash{stroke:#8296a0;stroke-dasharray:5 5;fill:none}</style><rect width="760" height="330" fill="#fcfefe"/><text x="25" y="32" text-anchor="start" class="title">After contact: sliding on a rough strip</text><rect x="105" y="137" width="118" height="48" rx="5" class="a"/><text x="164" y="167" text-anchor="middle">4 kg</text><path d="M130 114H215" class="arrow"/><text x="171" y="100" text-anchor="middle">4 m/s</text><path d="M125 162H45" class="force"/><text x="87" y="148" text-anchor="middle">8 N</text><path d="M164 138V66" class="force"/><text x="179" y="70" text-anchor="start">N</text><path d="M164 185V249" class="force"/><text x="179" y="245" text-anchor="start">mg</text><path d="M25 190H735" class="line"/><rect x="550" y="137" width="118" height="48" class="dash"/><text x="609" y="162" text-anchor="middle">rest</text><path d="M164 268H609" class="arrow"/><text x="386" y="255" text-anchor="middle">4 m travelled</text><text x="380" y="310" text-anchor="middle">K: 32 J → 0; friction work = −32 J</text></svg>
