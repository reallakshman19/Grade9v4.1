<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-labelledby="t d">
<title id="t">Two different physical intervals</title><desc id="d">A moving cart hits another cart, which latches. After impact the pair climbs a smooth ramp. The figure labels the states and the different physical relationships.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#146b67"/></marker></defs>
<style>text{font:18px system-ui,sans-serif;fill:#193b50} .cap{font-weight:bold;font-size:21px} .rail{stroke:#547184;stroke-width:3} .cart{fill:#e3f1f6;stroke:#275b75;stroke-width:2.5} .b{fill:#e0f3ec;stroke:#146b67;stroke-width:2.5} .arr{stroke:#146b67;stroke-width:3;marker-end:url(#a);fill:none} .dim{stroke:#64748b;stroke-width:2;fill:none}</style><rect width="700" height="340" fill="#fcfefe"/>
<text class="cap" x="28" y="30">Impact: short time</text><text class="cap" x="370" y="30">Later motion: smooth ramp</text><path d="M350 12V318" stroke="#c6d9e1" stroke-dasharray="6 6"/><rect class="cart" x="35" y="116" width="100" height="48" rx="6"/><circle cx="51" cy="168" r="8" fill="#275b75"/><circle cx="119" cy="168" r="8" fill="#275b75"/><text x="85" y="147" text-anchor="middle">2 kg</text><rect class="b" x="192" y="116" width="100" height="48" rx="6"/><circle cx="208" cy="168" r="8" fill="#275b75"/><circle cx="276" cy="168" r="8" fill="#275b75"/><text x="242" y="147" text-anchor="middle">1 kg</text><path class="arr" d="M48 99L126 99"/><text x="86" y="87" text-anchor="middle">6 m/s</text><text x="242" y="95" text-anchor="middle">rest</text><path class="rail" d="M20 181H326"/><text x="30" y="222">External horizontal impulse ≈ 0</text><text x="30" y="252">Momentum ledger for both carts</text><path class="rail" d="M365 258H435L650 117"/><g transform="translate(478 213) rotate(-33)"><rect class="b" x="0" y="-65" width="132" height="48" rx="6"/><circle cx="16" cy="-13" r="8" fill="#275b75"/><circle cx="116" cy="-13" r="8" fill="#275b75"/><text x="66" y="-34" text-anchor="middle">3 kg</text></g><path class="dim" d="M660 258V117M651 258H669M651 117H669"/><text x="680" y="193" text-anchor="middle">h</text><text x="370" y="292">Work–energy ledger after contact</text><text x="370" y="317">Height, not ramp length</text></svg>
