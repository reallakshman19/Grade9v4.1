<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-labelledby="t d">
<title id="t">Two approaching carts</title><desc id="d">A four kilogram cart moves right at three metres per second, a two kilogram cart moves left at six metres per second; they approach on a smooth track.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#146b67"/></marker></defs>
<style>text{font:18px system-ui,sans-serif;fill:#193b50} .cap{font-weight:bold;font-size:21px} .rail{stroke:#547184;stroke-width:3} .cart{fill:#e3f1f6;stroke:#275b75;stroke-width:2.5} .b{fill:#e0f3ec;stroke:#146b67;stroke-width:2.5} .arr{stroke:#146b67;stroke-width:3;marker-end:url(#a);fill:none} .dim{stroke:#64748b;stroke-width:2;fill:none}</style><rect width="700" height="340" fill="#fcfefe"/>
<text class="cap" x="28" y="38">Before contact · smooth track</text><rect class="cart" x="105" y="132" width="130" height="48" rx="6"/><circle cx="121" cy="184" r="8" fill="#275b75"/><circle cx="219" cy="184" r="8" fill="#275b75"/><text x="170" y="163" text-anchor="middle">4 kg</text><rect class="b" x="460" y="132" width="110" height="48" rx="6"/><circle cx="476" cy="184" r="8" fill="#275b75"/><circle cx="554" cy="184" r="8" fill="#275b75"/><text x="515" y="163" text-anchor="middle">2 kg</text><path class="arr" d="M125 115L215 115"/><text x="170" y="100" text-anchor="middle">3 m/s</text><path class="arr" d="M560 115L470 115"/><text x="515" y="100" text-anchor="middle">6 m/s</text><path class="rail" d="M25 200H675"/><text x="350" y="250" text-anchor="middle">The carts latch on contact.</text><text x="350" y="285" text-anchor="middle">External horizontal impulse during contact is negligible.</text></svg>
