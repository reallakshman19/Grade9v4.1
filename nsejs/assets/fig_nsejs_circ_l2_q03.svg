<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%" style="background:#ffffff; border:1.5px solid #cbd5e1; border-radius:10px;">

  <style>
    .wire { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash-wire { stroke: #64748b; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
    .res-box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 4; }
    .res-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    .node-pt { fill: #1e293b; }
    .term-pt { fill: #ea580c; stroke: #9a3412; stroke-width: 2; }
    .term-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #c2410c; text-anchor: middle; dominant-baseline: central; }
    .node-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    .diag-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .diag-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
  </style>

  <text x="260" y="30" class="diag-title">Fig. 3: Circuit with Ideal Wire Across 2 &#937; Resistor</text>
  <text x="260" y="50" class="diag-sub">Find equivalent resistance between A and B</text>

  <!-- Terminals -->
  <line x1="50" y1="150" x2="90" y2="150" class="wire"/>
  <circle cx="50" cy="150" r="7" class="term-pt"/>
  <text x="50" y="125" class="term-lbl">A</text>

  <line x1="430" y1="150" x2="470" y2="150" class="wire"/>
  <circle cx="470" cy="150" r="7" class="term-pt"/>
  <text x="470" y="125" class="term-lbl">B</text>

  <!-- Bus left and right -->
  <line x1="90" y1="100" x2="90" y2="190" class="wire"/>
  <circle cx="90" cy="150" r="4" class="node-pt"/>
  <circle cx="90" cy="100" r="4" class="node-pt"/>
  <circle cx="90" cy="190" r="4" class="node-pt"/>

  <line x1="430" y1="100" x2="430" y2="190" class="wire"/>
  <circle cx="430" cy="150" r="4" class="node-pt"/>
  <circle cx="430" cy="100" r="4" class="node-pt"/>
  <circle cx="430" cy="190" r="4" class="node-pt"/>

  <!-- Top branch: 6 ohm -->
  <line x1="90" y1="100" x2="220" y2="100" class="wire"/>
  <rect x="220" y="86" width="80" height="28" class="res-box"/>
  <text x="260" y="100" class="res-lbl">6 &#937;</text>
  <line x1="300" y1="100" x2="430" y2="100" class="wire"/>

  <!-- Bottom branch: 3 ohm + shorted 2 ohm -->
  <line x1="90" y1="190" x2="160" y2="190" class="wire"/>
  <rect x="160" y="176" width="75" height="28" class="res-box"/>
  <text x="197" y="190" class="res-lbl">3 &#937;</text>
  <line x1="235" y1="190" x2="290" y2="190" class="wire"/>
  <circle cx="290" cy="190" r="4" class="node-pt"/>

  <!-- 2 ohm resistor -->
  <rect x="290" y="176" width="75" height="28" class="res-box" style="stroke:#dc2626; fill:#fef2f2;"/>
  <text x="327" y="190" class="res-lbl" style="fill:#b91c1c;">2 &#937;</text>
  <circle cx="365" cy="190" r="4" class="node-pt"/>
  <line x1="365" y1="190" x2="430" y2="190" class="wire"/>

  <!-- Jumper wire shorting the 2 ohm resistor -->
  <line x1="290" y1="190" x2="290" y2="235" class="wire" style="stroke:#2563eb; stroke-width:3;"/>
  <line x1="290" y1="235" x2="365" y2="235" class="wire" style="stroke:#2563eb; stroke-width:3;"/>
  <line x1="365" y1="235" x2="365" y2="190" class="wire" style="stroke:#2563eb; stroke-width:3;"/>
  <text x="327" y="255" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">Added ideal wire</text>
</svg>
