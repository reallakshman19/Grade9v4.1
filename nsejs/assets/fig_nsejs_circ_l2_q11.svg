<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" width="100%" height="100%" style="background:#ffffff; border:1.5px solid #cbd5e1; border-radius:10px;">

  <style>
    .wire { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash-wire { stroke: #64748b; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
    .res-box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 4; }
    .res-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    .node-pt { fill: #1e293b; }
    .term-pt { fill: #ea580c; stroke: #9a3412; stroke-width: 2; }
    .term-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #c2410c; text-anchor: middle; dominant-baseline: central; }
    .node-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    .diag-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .diag-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
  </style>

  <text x="230" y="30" class="diag-title">Fig. 10: 2 &#215; 2 Square Grid of 12 Resistors</text>
  <text x="230" y="50" class="diag-sub">Each resistor R = 4 &#937; &#183; Terminals across opposite corners A and B</text>

  <!-- Grid vertices: x in (80, 230, 380), y in (100, 240, 380) -->
  <!-- Horizontal lines & resistors -->
  <!-- Bottom row y=380 -->
  <line x1="80" y1="380" x2="380" y2="380" class="wire"/>
  <rect x="125" y="366" width="60" height="28" class="res-box"/>
  <text x="155" y="380" class="res-lbl">4 &#937;</text>
  <rect x="275" y="366" width="60" height="28" class="res-box"/>
  <text x="305" y="380" class="res-lbl">4 &#937;</text>

  <!-- Middle row y=240 -->
  <line x1="80" y1="240" x2="380" y2="240" class="wire"/>
  <rect x="125" y="226" width="60" height="28" class="res-box"/>
  <text x="155" y="240" class="res-lbl">4 &#937;</text>
  <rect x="275" y="226" width="60" height="28" class="res-box"/>
  <text x="305" y="240" class="res-lbl">4 &#937;</text>

  <!-- Top row y=100 -->
  <line x1="80" y1="100" x2="380" y2="100" class="wire"/>
  <rect x="125" y="86" width="60" height="28" class="res-box"/>
  <text x="155" y="100" class="res-lbl">4 &#937;</text>
  <rect x="275" y="86" width="60" height="28" class="res-box"/>
  <text x="305" y="100" class="res-lbl">4 &#937;</text>

  <!-- Vertical lines & resistors -->
  <!-- Left column x=80 -->
  <line x1="80" y1="100" x2="80" y2="380" class="wire"/>
  <rect x="66" y="145" width="28" height="60" class="res-box"/>
  <text x="80" y="175" class="res-lbl">4 &#937;</text>
  <rect x="66" y="285" width="28" height="60" class="res-box"/>
  <text x="80" y="315" class="res-lbl">4 &#937;</text>

  <!-- Middle column x=230 -->
  <line x1="230" y1="100" x2="230" y2="380" class="wire"/>
  <rect x="216" y="145" width="28" height="60" class="res-box"/>
  <text x="230" y="175" class="res-lbl">4 &#937;</text>
  <rect x="216" y="285" width="28" height="60" class="res-box"/>
  <text x="230" y="315" class="res-lbl">4 &#937;</text>

  <!-- Right column x=380 -->
  <line x1="380" y1="100" x2="380" y2="380" class="wire"/>
  <rect x="366" y="145" width="28" height="60" class="res-box"/>
  <text x="380" y="175" class="res-lbl">4 &#937;</text>
  <rect x="366" y="285" width="28" height="60" class="res-box"/>
  <text x="380" y="315" class="res-lbl">4 &#937;</text>

  <!-- Nodes -->
  <circle cx="230" cy="380" r="4" class="node-pt"/>
  <circle cx="380" cy="380" r="4" class="node-pt"/>
  <circle cx="80" cy="240" r="4" class="node-pt"/>
  <circle cx="230" cy="240" r="4" class="node-pt"/>
  <circle cx="380" cy="240" r="4" class="node-pt"/>
  <circle cx="80" cy="100" r="4" class="node-pt"/>
  <circle cx="230" cy="100" r="4" class="node-pt"/>

  <!-- Terminals A & B -->
  <circle cx="80" cy="380" r="7" class="term-pt"/>
  <text x="55" y="400" class="term-lbl">A</text>

  <circle cx="380" cy="100" r="7" class="term-pt"/>
  <text x="405" y="85" class="term-lbl">B</text>

  
</svg>
