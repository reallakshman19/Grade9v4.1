<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 780 440" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="vesselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background panel -->
  <rect x="0" y="0" width="780" height="440" rx="12" fill="url(#panelGrad)"/>

  <!-- Title & Header -->
  <text x="30" y="36" fill="#0f172a" font-size="18" font-weight="700">Dalton's Law of Partial Pressures: CH₄ + CO₂ Gas Mixture</text>
  <text x="30" y="58" fill="#475569" font-size="14">Rigid Enclosure of Fixed Volume V at Uniform Thermal Equilibrium Temperature T</text>

  <!-- Rigid Vessel Outer Shell -->
  <rect x="50" y="90" width="260" height="250" rx="20" fill="url(#vesselGrad)" stroke="#0284c7" stroke-width="3"/>
  <text x="180" y="118" text-anchor="middle" fill="#0369a1" font-size="15" font-weight="700">Rigid Chamber (V, T)</text>

  <!-- Gas Molecules in Chamber -->
  <!-- CH4 molecules (Blue dots) -->
  <circle cx="100" cy="160" r="12" fill="#0284c7"/>
  <text x="100" y="164" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">C</text>

  <circle cx="210" cy="150" r="12" fill="#0284c7"/>
  <text x="210" y="154" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">C</text>

  <circle cx="150" cy="220" r="12" fill="#0284c7"/>
  <text x="150" y="224" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">C</text>

  <circle cx="90" cy="280" r="12" fill="#0284c7"/>
  <text x="90" y="284" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">C</text>

  <circle cx="230" cy="260" r="12" fill="#0284c7"/>
  <text x="230" y="264" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">C</text>

  <!-- CO2 molecules (Teal capsules) -->
  <rect x="130" y="170" width="44" height="20" rx="10" fill="#0d9488"/>
  <text x="152" y="185" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">CO₂</text>

  <rect x="190" y="200" width="44" height="20" rx="10" fill="#0d9488"/>
  <text x="212" y="215" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">CO₂</text>

  <rect x="75" y="210" width="44" height="20" rx="10" fill="#0d9488"/>
  <text x="97" y="225" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">CO₂</text>

  <rect x="140" y="275" width="44" height="20" rx="10" fill="#0d9488"/>
  <text x="162" y="290" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">CO₂</text>

  <!-- Manometer Connection Pipe -->
  <rect x="310" y="180" width="50" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

  <!-- U-Tube Manometer -->
  <path d="M 360 187 L 380 187 L 380 300 Q 380 330 405 330 Q 430 330 430 300 L 430 180" fill="none" stroke="#64748b" stroke-width="12"/>
  <path d="M 374 240 L 374 300 Q 374 324 405 324 Q 436 324 436 300 L 436 210" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <text x="405" y="355" text-anchor="middle" fill="#475569" font-size="14">Mercury Column Δh</text>

  <!-- Right Side Quantitative Analysis Box -->
  <rect x="460" y="90" width="290" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="120" fill="#0f172a" font-size="16" font-weight="700">Mole &amp; Pressure Quantities</text>

  <text x="480" y="152" fill="#0284c7" font-size="14" font-weight="600">• Methane (CH₄, M = 16 g/mol):</text>
  <text x="495" y="172" fill="#334155" font-size="14">n_CH₄ = 4.0 g / 16.0 g/mol = 0.25 mol</text>

  <text x="480" y="204" fill="#0d9488" font-size="14" font-weight="600">• Carbon Dioxide (CO₂, M = 44 g/mol):</text>
  <text x="495" y="224" fill="#334155" font-size="14">n_CO₂ = 8.8 g / 44.0 g/mol = 0.20 mol</text>

  <text x="480" y="254" fill="#0f172a" font-size="14" font-weight="600">• Total Moles in Vessel:</text>
  <text x="495" y="274" fill="#334155" font-size="14">n_total = 0.25 + 0.20 = 0.45 mol</text>

  <line x1="480" y1="290" x2="730" y2="290" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="312" fill="#0369a1" font-size="14" font-weight="700">Dalton Mole Fraction Law:</text>
  <text x="480" y="330" fill="#0d9488" font-size="14" font-weight="700">P_CH₄ / P_total = n_CH₄ / n_total = 5 / 9</text>

  <!-- Bottom Result Banner -->
  <rect x="50" y="365" width="700" height="55" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="70" y="398" fill="#0f172a" font-size="15" font-weight="700">Equilibrium Result:</text>
  <text x="215" y="398" fill="#0f766e" font-size="15" font-weight="700">Ratio P(CH₄) / P(total) = 0.25 / 0.45 = 5/9 ≈ 0.556 (Option C Verified)</text>
</svg>
