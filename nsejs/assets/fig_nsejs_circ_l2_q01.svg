<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%" style="background:#ffffff; border:1.5px solid #cbd5e1; border-radius:10px;">

  <style>
    .wire { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash-wire { stroke: #64748b; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
    .res-box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 4; }
    .res-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    .node-pt { fill: #1e293b; }
    .term-pt { fill: #ea580c; stroke: #9a3412; stroke-width: 2; }
    .term-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #c2410c; text-anchor: middle; dominant-baseline: central; }
    .node-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    .diag-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .diag-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
  </style>

  <text x="260" y="30" class="diag-title">Fig. 1: Three Branches in Parallel</text>
  <text x="260" y="50" class="diag-sub">Find equivalent resistance between A and B</text>

  <!-- Terminals -->
  <line x1="50" y1="160" x2="100" y2="160" class="wire"/>
  <circle cx="50" cy="160" r="7" class="term-pt"/>
  <text x="50" y="135" class="term-lbl">A</text>

  <line x1="420" y1="160" x2="470" y2="160" class="wire"/>
  <circle cx="470" cy="160" r="7" class="term-pt"/>
  <text x="470" y="135" class="term-lbl">B</text>

  <!-- Vertical busbars -->
  <line x1="100" y1="90" x2="100" y2="230" class="wire"/>
  <circle cx="100" cy="160" r="4" class="node-pt"/>
  <circle cx="100" cy="90" r="4" class="node-pt"/>
  <circle cx="100" cy="230" r="4" class="node-pt"/>

  <line x1="420" y1="90" x2="420" y2="230" class="wire"/>
  <circle cx="420" cy="160" r="4" class="node-pt"/>
  <circle cx="420" cy="90" r="4" class="node-pt"/>
  <circle cx="420" cy="230" r="4" class="node-pt"/>

  <!-- Top branch: 2 ohm -->
  <line x1="100" y1="90" x2="220" y2="90" class="wire"/>
  <rect x="220" y="76" width="80" height="28" class="res-box"/>
  <text x="260" y="90" class="res-lbl">2 &#937;</text>
  <line x1="300" y1="90" x2="420" y2="90" class="wire"/>

  <!-- Middle branch: 1 ohm + 3 ohm -->
  <line x1="100" y1="160" x2="160" y2="160" class="wire"/>
  <rect x="160" y="146" width="70" height="28" class="res-box"/>
  <text x="195" y="160" class="res-lbl">1 &#937;</text>
  <line x1="230" y1="160" x2="290" y2="160" class="wire"/>
  <rect x="290" y="146" width="70" height="28" class="res-box"/>
  <text x="325" y="160" class="res-lbl">3 &#937;</text>
  <line x1="360" y1="160" x2="420" y2="160" class="wire"/>

  <!-- Bottom branch: 4 ohm -->
  <line x1="100" y1="230" x2="220" y2="230" class="wire"/>
  <rect x="220" y="216" width="80" height="28" class="res-box"/>
  <text x="260" y="230" class="res-lbl">4 &#937;</text>
  <line x1="300" y1="230" x2="420" y2="230" class="wire"/>
</svg>
