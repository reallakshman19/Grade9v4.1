<text x="193" y="391" text-anchor="middle" font-size="23" font-weight="bold" fill="#216947">1 P–OH → monobasic</text>
<text x="540" y="391" text-anchor="middle" font-size="23" font-weight="bold" fill="#216947">2 P–OH → dibasic</text>
