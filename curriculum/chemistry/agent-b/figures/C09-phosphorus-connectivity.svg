<text x="193" y="258" font-size="35" text-anchor="middle" fill="#1d3750">P</text><text x="540" y="258" font-size="35" text-anchor="middle" fill="#1d3750">P</text><text x="887" y="258" font-size="35" text-anchor="middle" fill="#1d3750">P</text>
