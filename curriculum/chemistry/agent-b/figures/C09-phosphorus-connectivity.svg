<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 490" role="img" aria-labelledby="t d">
<title id="t">Phosphorus oxyacid connectivity and acid basicity</title>
<desc id="d">H3PO2 has one P–OH and two P–H bonds. H3PO3 has two P–OH and one P–H. H3PO4 has three P–OH. In the simplified structural model their acid basicities are 1, 2 and 3 respectively.</desc>
<rect width="1080" height="490" fill="#fcfcfc"/><text x="35" y="46" font-size="27" font-family="sans-serif" font-weight="bold" fill="#182a3e">Which hydrogens are acidic?</text><text x="35" y="78" font-size="18" font-family="sans-serif" fill="#536378">Schematic connectivity (not molecular geometry) · P–OH shown in green; P–H shown in orange</text>
<g font-family="sans-serif" stroke-width="0">
<rect x="30" y="104" width="326" height="330" rx="20" fill="#f3f6f9" stroke="#b1c0cb" stroke-width="2"/>
