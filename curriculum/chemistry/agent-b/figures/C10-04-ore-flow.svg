<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Metallurgy: choose the conversion route</title><desc id="d">Parallel carbonate and sulfide routes converge on oxide; reduction and recovery are different operations. Schematic, not procedure.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">Metallurgy: choose the conversion route</text><rect x="24" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Ore conversion</text><rect x="476" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="492" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Common oxide reduction</text><rect x="48" y="153" width="166" height="60" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="131" y="190" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">Carbonate</text><rect x="48" y="245" width="166" height="60" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="131" y="282" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">Sulfide</text><rect x="272" y="198" width="130" height="60" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="337" y="235" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">Oxide</text><line x1="214" y1="183" x2="272" y2="215" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M272 215 l-9.999913223950273 -0.041659494289567264 M272 215 l-5.367920917695193 -8.437145549376897" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><line x1="214" y1="275" x2="272" y2="241" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M272 241 l-5.146338512036516 8.574100531223655 M272 241 l-9.995435382682018 0.3021117518872101" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><text x="218" y="157" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">CO₂</text><text x="218" y="304" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">SO₂</text><rect x="500" y="180" width="142" height="70" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="571" y="222" font-size="22" text-anchor="middle" font-weight="400" fill="#213d50">Oxide</text><line x1="642" y1="215" x2="714" y2="215" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M714 215 l-8.775825618903728 4.79425538604203 M714 215 l-8.775825618903728 -4.79425538604203" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><rect x="714" y="180" width="155" height="70" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="791" y="222" font-size="22" text-anchor="middle" font-weight="400" fill="#213d50">Metal</text><text x="650" y="177" font-size="15" text-anchor="start" font-weight="400" fill="#213d50">reduction</text><text x="500" y="300" font-size="18" text-anchor="start" font-weight="400" fill="#213d50">Feasible conditions required</text><text x="500" y="331" font-size="18" text-anchor="start" font-weight="400" fill="#213d50">Recovery ≠ conversion</text><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">The sequence depends on ore chemistry; gas and metal balances are separate.</text></g></svg>
