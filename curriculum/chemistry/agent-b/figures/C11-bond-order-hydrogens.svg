<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Bond order and hydrogen count</title><desc id="d">Ethane, ethene and ethyne with condensed CH groups and one, two or three explicit connecting bond lines.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">Bond order and hydrogen count</text><rect x="24" y="92" width="270" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Ethane</text><rect x="325" y="92" width="270" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="341" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Ethene</text><rect x="626" y="92" width="270" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="642" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Ethyne</text><line x1="128" y1="220" x2="190" y2="220" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><circle cx="97" cy="220" r="32" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="97" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₃</text><circle cx="221" cy="220" r="32" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="221" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₃</text><text x="159" y="300" font-size="25" text-anchor="middle" font-weight="700" fill="#213d50">C₂H₆</text><text x="159" y="332" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">1 C–C bond order</text><line x1="429" y1="215.5" x2="491" y2="215.5" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><line x1="429" y1="224.5" x2="491" y2="224.5" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><circle cx="398" cy="220" r="32" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="398" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₂</text><circle cx="522" cy="220" r="32" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="522" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₂</text><text x="460" y="300" font-size="25" text-anchor="middle" font-weight="700" fill="#213d50">C₂H₄</text><text x="460" y="332" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">2 C–C bond order</text><line x1="730" y1="211" x2="792" y2="211" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><line x1="730" y1="220" x2="792" y2="220" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><line x1="730" y1="229" x2="792" y2="229" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><circle cx="699" cy="220" r="32" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="699" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH</text><circle cx="823" cy="220" r="32" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="823" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH</text><text x="761" y="300" font-size="25" text-anchor="middle" font-weight="700" fill="#213d50">C₂H₂</text><text x="761" y="332" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">3 C–C bond order</text><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">Each extra C–C bond order replaces two C–H bonds in this two-carbon series.</text></g></svg>
