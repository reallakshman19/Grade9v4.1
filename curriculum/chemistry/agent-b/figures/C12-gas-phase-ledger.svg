<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Gas inventory before and after cooling</title><desc id="d">Methane combustion with excess oxygen, complete reaction under stated ideal conditions.</desc><rect width="1100" height="480" fill="#fff"/><text x="36" y="47" font-size="29" font-family="sans-serif" font-weight="700" fill="#172f43">Gas inventory before and after cooling</text><text x="36" y="79" font-size="18" font-family="sans-serif" fill="#50687b">Methane combustion with excess oxygen, complete reaction under stated ideal conditions.</text><rect x="38" y="126" rx="18" width="336" height="257" fill="#f0f7fb" stroke="#afc4ce" stroke-width="2"/><text x="59" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Before</text><text x="60" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">CH₄: 1 mol</text><text x="60" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">O₂: 3 mol</text><text x="60" y="273" font-family="sans-serif" font-size="20" fill="#3c5468">Gas total: 4</text><rect x="398" y="126" rx="18" width="336" height="257" fill="#fff6e8" stroke="#afc4ce" stroke-width="2"/><text x="419" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Hot products</text><text x="420" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">CO₂: 1 · O₂: 1</text><text x="420" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">H₂O vapour: 2</text><text x="420" y="273" font-family="sans-serif" font-size="20" fill="#3c5468">Gas total: 4</text><rect x="758" y="126" rx="18" width="336" height="257" fill="#f0f7fb" stroke="#afc4ce" stroke-width="2"/><text x="779" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">After cooling</text><text x="780" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">CO₂: 1 · O₂: 1</text><text x="780" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">Water: liquid</text><text x="780" y="273" font-family="sans-serif" font-size="20" fill="#3c5468">Dry gas total: 2</text><path d="M375 275 h20 m-9 -10 l12 10 l-12 10" fill="none" stroke="#118575" stroke-width="4" stroke-linecap="round"/><path d="M735 275 h20 m-9 -10 l12 10 l-12 10" fill="none" stroke="#118575" stroke-width="4" stroke-linecap="round"/><text x="36" y="443" font-size="17" font-family="sans-serif" fill="#4d6475">Condensation removes water from the gas phase; it does not remove atoms from the system.</text></svg>
