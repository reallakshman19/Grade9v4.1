<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Reaction class and atom conservation</title><desc id="d">Ethene hydrogenation and ideal complete combustion shown as separate balanced pathways, not procedures.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">Reaction class and atom conservation</text><rect x="24" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Addition</text><rect x="476" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="492" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Complete combustion</text><text x="234" y="179" font-size="22" text-anchor="middle" font-weight="400" fill="#213d50">CH₂=CH₂ + H₂</text><line x1="234" y1="196" x2="234" y2="240" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M234 240 l-4.794255386042031 -8.775825618903726 M234 240 l4.794255386042029 -8.775825618903728" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><text x="234" y="272" font-size="22" text-anchor="middle" font-weight="400" fill="#213d50">CH₃–CH₃</text><text x="234" y="326" font-size="18" text-anchor="middle" font-weight="400" fill="#213d50">C₂ remains C₂</text><text x="686" y="179" font-size="22" text-anchor="middle" font-weight="400" fill="#213d50">C₂H₄ + 3O₂</text><line x1="686" y1="196" x2="686" y2="240" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M686 240 l-4.794255386042031 -8.775825618903726 M686 240 l4.794255386042029 -8.775825618903728" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><text x="686" y="272" font-size="22" text-anchor="middle" font-weight="400" fill="#213d50">2CO₂ + 2H₂O</text><text x="686" y="326" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">Carbon and hydrogen conserved</text><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">Product assumptions determine the balanced equation; incomplete combustion requires data.</text></g></svg>
