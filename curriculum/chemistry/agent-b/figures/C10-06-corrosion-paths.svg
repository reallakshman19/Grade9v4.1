<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Corrosion has two connected paths</title><desc id="d">Wet iron permits coupled oxidation and oxygen reduction. Zinc protection needs contact and ionic path; diagram is schematic.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">Corrosion has two connected paths</text><rect x="24" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Wet iron: coupled processes</text><rect x="476" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="492" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Zinc protection requires contact</text><rect x="52" y="170" width="364" height="105" rx="13" fill="#e5f4fa" stroke="#b3c8d1" stroke-width="2"/><text x="66" y="193" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">Water / electrolyte</text><rect x="52" y="275" width="364" height="48" rx="13" fill="#c0c8d0" stroke="#b3c8d1" stroke-width="2"/><text x="234" y="305" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">Iron</text><text x="72" y="246" font-size="16" text-anchor="start" font-weight="400" fill="#213d50">Fe → Fe²⁺ + 2e⁻</text><text x="258" y="246" font-size="16" text-anchor="start" font-weight="400" fill="#213d50">O₂ reduction</text><line x1="120" y1="292" x2="330" y2="292" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M330 292 l-8.775825618903728 4.79425538604203 M330 292 l-8.775825618903728 -4.79425538604203" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><line x1="130" y1="275" x2="130" y2="251" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M130 251 l4.794255386042029 8.775825618903728 M130 251 l-4.794255386042031 8.775825618903726" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><line x1="334" y1="251" x2="334" y2="275" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M334 275 l-4.794255386042031 -8.775825618903726 M334 275 l4.794255386042029 -8.775825618903728" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><rect x="500" y="190" width="372" height="100" rx="13" fill="#e5f4fa" stroke="#b3c8d1" stroke-width="2"/><rect x="500" y="290" width="372" height="45" rx="13" fill="#c0c8d0" stroke="#b3c8d1" stroke-width="2"/><text x="686" y="318" font-size="18" text-anchor="middle" font-weight="400" fill="#213d50">Connected iron</text><rect x="500" y="270" width="120" height="20" rx="13" fill="#f1c37c" stroke="#b3c8d1" stroke-width="2"/><rect x="752" y="270" width="120" height="20" rx="13" fill="#f1c37c" stroke="#b3c8d1" stroke-width="2"/><text x="560" y="255" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">Zn</text><text x="813" y="255" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">Zn</text><line x1="565" y1="306" x2="682" y2="306" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M682 306 l-8.775825618903728 4.79425538604203 M682 306 l-8.775825618903728 -4.79425538604203" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><text x="686" y="254" font-size="16" text-anchor="middle" font-weight="400" fill="#213d50">scratch</text><line x1="686" y1="258" x2="686" y2="285" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M686 285 l-4.794255386042031 -8.775825618903726 M686 285 l4.794255386042029 -8.775825618903728" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">Oxygen is a common electron acceptor; salt changes ionic transport, not electron balance.</tex