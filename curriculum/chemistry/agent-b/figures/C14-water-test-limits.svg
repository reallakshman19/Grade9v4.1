<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Clear water is not a chemical purity certificate</title><desc id="d">Different treatment and testing methods target different material classes.</desc><rect width="1100" height="480" fill="#fff"/><text x="36" y="47" font-size="29" font-family="sans-serif" font-weight="700" fill="#172f43">Clear water is not a chemical purity certificate</text><text x="36" y="79" font-size="18" font-family="sans-serif" fill="#50687b">Different treatment and testing methods target different material classes.</text><rect x="38" y="126" rx="18" width="336" height="257" fill="#f0f7fb" stroke="#afc4ce" stroke-width="2"/><text x="59" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Untreated water</text><text x="60" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">Suspended soil</text><text x="60" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">Na⁺ and Cl⁻ dissolved</text><text x="60" y="273" font-family="sans-serif" font-size="20" fill="#3c5468">Microbes possible</text><rect x="398" y="126" rx="18" width="336" height="257" fill="#fff6e8" stroke="#afc4ce" stroke-width="2"/><text x="419" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Ordinary filtration</text><text x="420" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">Traps many solids</text><text x="420" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">Does not desalinate</text><rect x="758" y="126" rx="18" width="336" height="257" fill="#f0f7fb" stroke="#afc4ce" stroke-width="2"/><text x="779" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Clearer water</text><text x="780" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">Less turbidity</text><text x="780" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">Dissolved ions remain</text><text x="780" y="273" font-family="sans-serif" font-size="20" fill="#3c5468">Safety unverified</text><path d="M375 275 h20 m-9 -10 l12 10 l-12 10" fill="none" stroke="#118575" stroke-width="4" stroke-linecap="round"/><path d="M735 275 h20 m-9 -10 l12 10 l-12 10" fill="none" stroke="#118575" stroke-width="4" stroke-linecap="round"/><text x="36" y="443" font-size="17" font-family="sans-serif" fill="#4d6475">Evaluate clarity, solute content and microorganisms separately before claiming safety.</text></svg>
