<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Electron accounting in acidic redox</title><desc id="d">Formal ion–electron balancing requires both mass and net charge conservation.</desc><rect width="1100" height="480" fill="#fff"/><text x="36" y="47" font-size="29" font-family="sans-serif" font-weight="700" fill="#172f43">Electron accounting in acidic redox</text><text x="36" y="79" font-size="18" font-family="sans-serif" fill="#50687b">Formal ion–electron balancing requires both mass and net charge conservation.</text><rect x="38" y="126" rx="18" width="336" height="257" fill="#f0f7fb" stroke="#afc4ce" stroke-width="2"/><text x="59" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Oxidation ×5</text><text x="60" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">5 Fe²⁺ → 5 Fe³⁺</text><text x="60" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">Five electrons lost</text><circle cx="114" cy="326" r="30" fill="#b4d8ee" stroke="#5a86a0"/><text x="114" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">e⁻</text><circle cx="200" cy="326" r="30" fill="#fde0b6" stroke="#5a86a0"/><text x="200" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">e⁻</text><circle cx="286" cy="326" r="30" fill="#b4d8ee" stroke="#5a86a0"/><text x="286" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">e⁻</text><rect x="398" y="126" rx="18" width="336" height="257" fill="#fff6e8" stroke="#afc4ce" stroke-width="2"/><text x="419" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Electron bridge</text><text x="420" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">Five e⁻ donated</text><text x="420" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">and accepted</text><rect x="758" y="126" rx="18" width="336" height="257" fill="#f0f7fb" stroke="#afc4ce" stroke-width="2"/><text x="779" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Reduction</text><text x="780" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">MnO₄⁻ + 8H⁺ + 5e⁻</text><text x="780" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">→ Mn²⁺ + 4H₂O</text><path d="M375 275 h20 m-9 -10 l12 10 l-12 10" fill="none" stroke="#118575" stroke-width="4" stroke-linecap="round"/><path d="M735 275 h20 m-9 -10 l12 10 l-12 10" fill="none" stroke="#118575" stroke-width="4" stroke-linecap="round"/><text x="36" y="443" font-size="17" font-family="sans-serif" fill="#4d6475">Extension: after combining halves, electrons cancel and total charges match.</text></svg>
