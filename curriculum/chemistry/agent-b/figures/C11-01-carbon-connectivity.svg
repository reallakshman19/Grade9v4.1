<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Carbon valence constrains skeletons</title><desc id="d">Butane and 2-methylpropane shown as condensed carbon groups; both C4H10, different connectivity.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">Carbon valence constrains skeletons</text><rect x="24" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Linear carbon skeleton</text><rect x="476" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="492" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Branched carbon skeleton</text><circle cx="85" cy="222" r="30" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="85" y="228" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₃</text><line x1="115" y1="222" x2="153" y2="222" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><circle cx="183" cy="222" r="30" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="183" y="228" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₂</text><line x1="213" y1="222" x2="251" y2="222" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><circle cx="281" cy="222" r="30" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="281" y="228" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₂</text><line x1="311" y1="222" x2="349" y2="222" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><circle cx="379" cy="222" r="30" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="379" y="228" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₃</text><text x="234" y="304" font-size="18" text-anchor="middle" font-weight="400" fill="#213d50">4 carbons · 10 hydrogens</text><circle cx="686" cy="220" r="28" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="686" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH</text><circle cx="580" cy="220" r="28" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="580" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₃</text><circle cx="792" cy="220" r="28" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="792" y="226" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₃</text><circle cx="686" cy="158" r="28" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="686" y="164" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">CH₃</text><line x1="608" y1="220" x2="658" y2="220" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><line x1="714" y1="220" x2="764" y2="220" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><line x1="686" y1="186" x2="686" y2="192" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><text x="686" y="305" font-size="18" text-anchor="middle" font-weight="400" fill="#213d50">Same formula, different graph</text><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">Typical neutral carbon has bond-order sum four. Count hydrogens after drawing connectivity.</text></g></svg>
