<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Displacement: order and charge</title><desc id="d">Two positive tests point toward C; no order between A and B. A separate electron ledger tests conservation.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">Displacement: order and charge</text><rect x="24" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Positive tests</text><rect x="476" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="492" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Independent electron ledger</text><circle cx="120" cy="180" r="25" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="120" y="186" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">A</text><circle cx="120" cy="292" r="25" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="120" y="298" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">B</text><circle cx="330" cy="236" r="25" fill="#d9ebf3" stroke="#52768d" stroke-width="2"/><text x="330" y="242" font-size="17" text-anchor="middle" font-weight="650" fill="#213d50">C</text><line x1="145" y1="180" x2="305" y2="225" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M305 225 l-9.746080223051885 2.239178484586907 M305 225 l-7.150033342276805 -6.991210424835601" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><line x1="145" y1="292" x2="305" y2="246" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M305 246 l-7.109488259036261 7.032437464679338 M305 246 l-9.758864978903429 -2.1827859087716788" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><line x1="120" y1="205" x2="120" y2="267" stroke="#a66a42" stroke-width="2" stroke-dasharray="7 7" stroke-linecap="round"/><text x="144" y="240" font-size="25" text-anchor="start" font-weight="400" fill="#213d50">?</text><text x="48" y="338" font-size="18" text-anchor="start" font-weight="400" fill="#213d50">No A/B edge established</text><text x="500" y="175" font-size="23" text-anchor="start" font-weight="400" fill="#213d50">M → M²⁺ + 2e⁻</text><text x="500" y="220" font-size="23" text-anchor="start" font-weight="400" fill="#213d50">N²⁺ + 2e⁻ → N</text><line x1="505" y1="247" x2="855" y2="247" stroke="#45677b" stroke-width="3"  stroke-linecap="round"/><text x="500" y="283" font-size="20" text-anchor="start" font-weight="400" fill="#213d50">Electron release = uptake</text><text x="500" y="320" font-size="18" text-anchor="start" font-weight="400" fill="#213d50">only for the sole reaction</text><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">An ordering is not a reaction-rate measurement; a coated negative test is not decisive.</text></g></svg>
