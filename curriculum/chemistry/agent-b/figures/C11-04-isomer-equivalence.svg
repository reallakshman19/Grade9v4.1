<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Isomer or just a different drawing?</title><desc id="d">Reversal of butan-2-ol preserves connectivity; butan-1-ol and diethyl ether differ in connectivity and functional class.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">Isomer or just a different drawing?</text><rect x="24" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Same connectivity</text><rect x="476" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="492" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Different connectivity</text><text x="234" y="177" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">CH₃–CH(OH)–CH₂–CH₃</text><text x="234" y="222" font-size="18" text-anchor="middle" font-weight="400" fill="#213d50">⇅ reverse numbering</text><text x="234" y="267" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">CH₃–CH₂–CH(OH)–CH₃</text><text x="234" y="326" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">One constitutional alcohol</text><text x="686" y="177" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">CH₃–CH₂–CH₂–CH₂OH</text><text x="686" y="222" font-size="32" text-anchor="middle" font-weight="400" fill="#213d50">≠</text><text x="686" y="267" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">CH₃CH₂–O–CH₂CH₃</text><text x="686" y="326" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">Alcohol vs ether</text><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">Compare bonds, not drawing direction. All displayed examples share C₄H₁₀O.</text></g></svg>
