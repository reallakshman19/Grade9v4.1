<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Ionic charge is not the same as mobile charge</title><desc id="d">Ions exist in a solid lattice and in a melt; their mobility differs.</desc><rect width="1100" height="480" fill="#fff"/><text x="36" y="47" font-size="29" font-family="sans-serif" font-weight="700" fill="#172f43">Ionic charge is not the same as mobile charge</text><text x="36" y="79" font-size="18" font-family="sans-serif" fill="#50687b">Ions exist in a solid lattice and in a melt; their mobility differs.</text><rect x="38" y="126" rx="18" width="336" height="257" fill="#f0f7fb" stroke="#afc4ce" stroke-width="2"/><text x="59" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Solid crystal</text><text x="60" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">Na⁺ and Cl⁻ fixed</text><text x="60" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">No bulk ion migration</text><circle cx="114" cy="326" r="30" fill="#b4d8ee" stroke="#5a86a0"/><text x="114" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">Na⁺</text><circle cx="200" cy="326" r="30" fill="#fde0b6" stroke="#5a86a0"/><text x="200" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">Cl⁻</text><circle cx="286" cy="326" r="30" fill="#b4d8ee" stroke="#5a86a0"/><text x="286" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">Na⁺</text><rect x="398" y="126" rx="18" width="336" height="257" fill="#fff6e8" stroke="#afc4ce" stroke-width="2"/><text x="419" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Melting</text><text x="420" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">Energy disrupts rigid</text><text x="420" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">lattice positions</text><rect x="758" y="126" rx="18" width="336" height="257" fill="#f0f7fb" stroke="#afc4ce" stroke-width="2"/><text x="779" y="167" font-family="sans-serif" font-size="23" font-weight="700" fill="#214056">Molten material</text><text x="780" y="205" font-family="sans-serif" font-size="20" fill="#3c5468">Na⁺ and Cl⁻ mobile</text><text x="780" y="239" font-family="sans-serif" font-size="20" fill="#3c5468">Charge can flow</text><circle cx="834" cy="326" r="30" fill="#b4d8ee" stroke="#5a86a0"/><text x="834" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">Cl⁻</text><circle cx="920" cy="326" r="30" fill="#fde0b6" stroke="#5a86a0"/><text x="920" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">Na⁺</text><circle cx="1006" cy="326" r="30" fill="#b4d8ee" stroke="#5a86a0"/><text x="1006" y="332" font-size="21" font-weight="600" text-anchor="middle" fill="#25445c">Cl⁻</text><path d="M375 275 h20 m-9 -10 l12 10 l-12 10" fill="none" stroke="#118575" stroke-width="4" stroke-linecap="round"/><path d="M735 275 h20 m-9 -10 l12 10 l-12 10" fill="none" stroke="#118575" stroke-width="4" stroke-linecap="round"/><text x="36" y="443" font-size="17" font-family="sans-serif" fill="#4d6475">The ions remain charged. Their ability to move, not the existence of charge alone, permits conduction.</text></svg>
