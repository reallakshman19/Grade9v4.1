<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">One oxide, two reagent contexts</title><desc id="d">Balanced ionic reactions for zinc oxide in acid and strong aqueous base; not the same as isolated dry zincate.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">One oxide, two reagent contexts</text><rect x="24" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Acid: oxide acts as base</text><rect x="476" y="92" width="420" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="492" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Strong aqueous base</text><text x="234" y="188" font-size="23" text-anchor="middle" font-weight="400" fill="#213d50">ZnO + 2H⁺</text><line x1="234" y1="202" x2="234" y2="245" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M234 245 l-4.794255386042031 -8.775825618903726 M234 245 l4.794255386042029 -8.775825618903728" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><text x="234" y="275" font-size="23" text-anchor="middle" font-weight="400" fill="#213d50">Zn²⁺ + H₂O</text><text x="234" y="326" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">Total charge +2 → +2</text><text x="686" y="188" font-size="21" text-anchor="middle" font-weight="400" fill="#213d50">ZnO + 2OH⁻ + H₂O</text><line x1="686" y1="202" x2="686" y2="245" stroke="#08796f" stroke-width="3"  stroke-linecap="round"/><path d="M686 245 l-4.794255386042031 -8.775825618903726 M686 245 l4.794255386042029 -8.775825618903728" fill="none" stroke="#08796f" stroke-width="3" stroke-linecap="round"/><text x="686" y="275" font-size="23" text-anchor="middle" font-weight="400" fill="#213d50">[Zn(OH)₄]²⁻</text><text x="686" y="326" font-size="17" text-anchor="middle" font-weight="400" fill="#213d50">Total charge −2 → −2</text><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">Both reagent contexts and product evidence support amphoterism; acid alone does not.</text></g></svg>
