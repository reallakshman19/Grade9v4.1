<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t d"><title id="t">Coating observations · S1</title><desc id="d">Exact supplied observations, grouped as data cards without an answer.</desc><rect width="920" height="400" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="24" y="43" font-size="25" text-anchor="start" font-weight="750" fill="#20394a">Coating observations · S1</text><rect x="24" y="83" width="424" height="86" rx="10" fill="#f1f6f8" stroke="#b0c6d0" stroke-width="2"/><text x="42" y="114" font-size="15" text-anchor="start" font-weight="650" fill="#52768d">Given 1</text><text x="42" y="144" font-size="19" text-anchor="start" font-weight="400" fill="#20394a">X: coating mass falls</text><rect x="472" y="83" width="424" height="86" rx="10" fill="#f1f6f8" stroke="#b0c6d0" stroke-width="2"/><text x="490" y="114" font-size="15" text-anchor="start" font-weight="650" fill="#52768d">Given 2</text><text x="490" y="144" font-size="19" text-anchor="start" font-weight="400" fill="#20394a">X: exposed iron little loss</text><rect x="24" y="190" width="424" height="86" rx="10" fill="#f1f6f8" stroke="#b0c6d0" stroke-width="2"/><text x="42" y="221" font-size="15" text-anchor="start" font-weight="650" fill="#52768d">Given 3</text><text x="42" y="251" font-size="19" text-anchor="start" font-weight="400" fill="#20394a">Y: coating little change</text><rect x="472" y="190" width="424" height="86" rx="10" fill="#f1f6f8" stroke="#b0c6d0" stroke-width="2"/><text x="490" y="221" font-size="15" text-anchor="start" font-weight="650" fill="#52768d">Given 4</text><text x="490" y="251" font-size="19" text-anchor="start" font-weight="400" fill="#20394a">Y: scratch iron loss</text><text x="24" y="365" font-size="18" text-anchor="start" font-weight="400" fill="#20394a">Identify the missing conclusion; the observations are not a solution.</text></g></svg>
