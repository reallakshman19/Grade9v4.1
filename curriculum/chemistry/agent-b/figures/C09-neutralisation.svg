<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="t d">
<title id="t">Particle-level neutralisation of an acid and a base</title>
<desc id="d">Hydronium and hydroxide join to make two water molecules. Sodium and chloride ions stay as spectators in the aqueous solution.</desc>
<rect width="1040" height="430" fill="#fcfcfc"/><text x="36" y="46" font-size="27" font-weight="bold" font-family="sans-serif" fill="#172439">Neutralisation: particles, not a slogan</text>
<text x="38" y="82" font-size="17" font-family="sans-serif" fill="#52627a">Aqueous HCl + aqueous NaOH → water + dissolved ions</text>
<rect x="36" y="113" width="415" height="222" rx="18" fill="#ecf5ff" stroke="#87a9c6" stroke-width="2"/>
<rect x="587" y="113" width="415" height="222" rx="18" fill="#edf9f3" stroke="#92bd9f" stroke-width="2"/>
<text x="56" y="148" font-size="21" font-family="sans-serif" font-weight="bold" fill="#1b3652">Before</text><text x="610" y="148" font-size="21" font-family="sans-serif" font-weight="bold" fill="#1b4e37">After</text>
<circle cx="120" cy="215" r="45" fill="#fbd4d2" stroke="#c45c55" stroke-width="2"/><text x="120" y="223" font-size="25" text-anchor="middle" font-family="sans-serif" fill="#812e2b">H₃O⁺</text>
<circle cx="260" cy="215" r="45" fill="#cde9fd" stroke="#548dbb" stroke-width="2"/><text x="260" y="223" font-size="25" text-anchor="middle" font-family="sans-serif" fill="#235780">OH⁻</text>
<circle cx="95" cy="294" r="24" fill="#ded8f4"/><text x="95" y="301" font-size="19" text-anchor="middle" font-family="sans-serif" fill="#423774">Na⁺</text>
<circle cx="298" cy="294" r="24" fill="#f1e4c9"/><text x="298" y="301" font-size="19" text-anchor="middle" font-family="sans-serif" fill="#725827">Cl⁻</text>
<path d="M465 226 H570" fill="none" stroke="#1c6b83" stroke-width="5" stroke-linecap="round"/><path d="M555 215 L573 226 L555 237" fill="none" stroke="#1c6b83" stroke-width="5" stroke-linecap="round"/>
<circle cx="668" cy="215" r="45" fill="#d7f1e7" stroke="#508b78" stroke-width="2"/><circle cx="803" cy="215" r="45" fill="#d7f1e7" stroke="#508b78" stroke-width="2"/>
<text x="668" y="222" font-size="23" text-anchor="middle" font-family="sans-serif" fill="#1f5948">H₂O</text><text x="803" y="222" font-size="23" text-anchor="middle" font-family="sans-serif" fill="#1f5948">H₂O</text>
<circle cx="665" cy="294" r="24" fill="#ded8f4"/><text x="665" y="301" font-size="19" text-anchor="middle" font-family="sans-serif" fill="#423774">Na⁺</text>
<circle cx="850" cy="294" r="24" fill="#f1e4c9"/><text x="850" y="301" font-size="19" text-anchor="middle" font-family="sans-serif" fill="#725827">Cl⁻</text>
<text x="40" y="379" font-size="18" font-family="sans-serif" fill="#293748">Na⁺ and Cl⁻ are spectators: they do not become the water molecules.</text>
<text x="40" y="406" font-size="15" font-family="sans-serif" fill="#677587">Schematic particles, not a scale model. Under ordinary dilute conditions NaCl remains dissolved.</text>
</svg>
