<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Functional groups depend on connectivity</title><desc id="d">Condensed structures of alcohol, carboxylic acid and ester; R and R prime represent carbon-containing substituents here.</desc><rect width="920" height="430" fill="white"/><g font-family="system-ui, sans-serif"><text x="24" y="43" font-size="28" text-anchor="start" font-weight="750" fill="#213d50">Functional groups depend on connectivity</text><rect x="24" y="92" width="270" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="40" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Alcohol</text><rect x="325" y="92" width="270" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="341" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Carboxylic acid</text><rect x="626" y="92" width="270" height="265" rx="13" fill="#f2f7fa" stroke="#b3c8d1" stroke-width="2"/><text x="642" y="124" font-size="20" text-anchor="start" font-weight="700" fill="#213d50">Ester</text><text x="159" y="204" font-size="22" text-anchor="middle" font-weight="650" fill="#213d50">R–OH</text><text x="159" y="270" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">C–O–H</text><text x="159" y="315" font-size="16" text-anchor="middle" font-weight="400" fill="#213d50">full connectivity</text><text x="460" y="204" font-size="22" text-anchor="middle" font-weight="650" fill="#213d50">R–C(=O)–OH</text><text x="460" y="270" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">–COOH</text><text x="460" y="315" font-size="16" text-anchor="middle" font-weight="400" fill="#213d50">full connectivity</text><text x="761" y="204" font-size="22" text-anchor="middle" font-weight="650" fill="#213d50">R–C(=O)–OR′</text><text x="761" y="270" font-size="20" text-anchor="middle" font-weight="400" fill="#213d50">–COOR′</text><text x="761" y="315" font-size="16" text-anchor="middle" font-weight="400" fill="#213d50">full connectivity</text><text x="24" y="402" font-size="17" text-anchor="start" font-weight="400" fill="#213d50">An O–H bond inside a carboxyl group does not make that group an ordinary alcohol.</text></g></svg>
