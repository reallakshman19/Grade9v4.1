<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">From mass to specified chemical entities</title><desc id="chartdesc">Mass in grams divided by molar mass gives amount in moles, which multiplied by Avogadro's constant gives a count of the specifically identified molecules, ions or formula units.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">From mass to specified chemical entities</text></g><rect x="30" y="88" width="260" height="180" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><rect x="320" y="88" width="260" height="180" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><rect x="610" y="88" width="260" height="180" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="160" y="126" font-size="24" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Mass (g)</text><text x="450" y="126" font-size="24" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Amount (mol)</text><text x="740" y="126" font-size="24" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Entities</text><text x="160" y="179" font-size="28" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">m</text><text x="450" y="179" font-size="28" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">n</text><text x="740" y="179" font-size="28" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">N</text><text x="300" y="174" font-size="28" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">→</text><text x="590" y="174" font-size="28" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">→</text><text x="304" y="212" font-size="17" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">÷ M</text><text x="595" y="212" font-size="17" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">× Nₐ</text><text x="450" y="251" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Species identity sets M and counted entity</text></svg>
