<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Three different dispersed systems</title><desc id="chartdesc">A true solution contains molecular or ionic solute; a colloid contains small dispersed droplets or particles; a suspension contains larger particles that may settle. Schematic particle sizes are not to scale.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">Three different dispersed systems</text></g><rect x="30" y="75" width="265" height="220" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="162" y="109" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">True solution</text><circle cx="45" cy="152" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><circle cx="90" cy="160" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><circle cx="130" cy="143" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><circle cx="180" cy="158" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><circle cx="210" cy="180" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><circle cx="61" cy="234" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><circle cx="116" cy="244" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><circle cx="176" cy="225" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><circle cx="224" cy="251" r="5" fill="#6bafc2" stroke="#346990" stroke-width="2"/><text x="162" y="288" font-size="15" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">ions/molecules</text><rect x="318" y="75" width="265" height="220" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="450" y="109" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Colloid</text><circle cx="351" cy="164" r="12" fill="#edc07e" stroke="#346990" stroke-width="2"/><circle cx="442" cy="155" r="12" fill="#edc07e" stroke="#346990" stroke-width="2"/><circle cx="512" cy="204" r="12" fill="#edc07e" stroke="#346990" stroke-width="2"/><circle cx="368" cy="250" r="12" fill="#edc07e" stroke="#346990" stroke-width="2"/><circle cx="475" cy="253" r="12" fill="#edc07e" stroke="#346990" stroke-width="2"/><text x="450" y="288" font-size="15" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">small dispersed droplets</text><rect x="606" y="75" width="265" height="220" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="738" y="109" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Suspension</text><circle cx="630" cy="250" r="17" fill="#b78d68" stroke="#346990" stroke-width="2"/><circle cx="687" cy="265" r="17" fill="#b78d68" stroke="#346990" stroke-width="2"/><circle cx="745" cy="258" r="17" fill="#b78d68" stroke="#346990" stroke-width="2"/><circle cx="798" cy="264" r="17" fill="#b78d68" stroke="#346990" stroke-width="2"/><circle cx="708" cy="221" r="17" fill="#b78d68" stroke="#346990" stroke-width="2"/><text x="738" y="288" font-size="15" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">larger, may settle</text></svg>
