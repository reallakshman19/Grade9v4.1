<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Periodic trends have direction and limits</title><desc id="chartdesc">Across a main-group period valence-electron attraction often increases; down a group increasing shell distance and shielding become important. Arrows are qualitative, not exact universal laws.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">Periodic trends have direction and limits</text></g><rect x="35" y="80" width="830" height="218" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="450" y="117" font-size="21" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Qualitative main-group tendencies</text><path d="M120 159 L740 159" fill="none" stroke="#2d6d94" stroke-width="6" stroke-linecap="round"/><path d="M740 159 l-17 -10 v20 Z" fill="#2d6d94"/><text x="435" y="145" font-size="17" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Across: electron attraction often increases</text><path d="M175 185 L175 265" fill="none" stroke="#ad7632" stroke-width="6" stroke-linecap="round"/><path d="M175 265 l-11 -17 h22 Z" fill="#ad7632"/><text x="535" y="250" font-size="17" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Down a group: shielding/size often increase</text></svg>
