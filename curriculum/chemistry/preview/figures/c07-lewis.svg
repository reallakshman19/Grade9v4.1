<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" role="img" aria-labelledby="t d">
<title id="t">Lewis structural representations of water and carbon dioxide</title><desc id="d">Water oxygen makes two single O-H bonds and has two lone electron pairs. Carbon dioxide is shown O double bond C double bond O, each oxygen with two lone pairs.</desc>
<rect width="850" height="300" rx="18" fill="#f4f8fc"/>
<g font-family="system-ui,sans-serif" font-weight="700" fill="#173550"><text x="30" y="43" font-size="26">Electron pairs and connectivity</text><text x="56" y="89" font-size="20">H₂O · 8 valence electrons</text><text x="451" y="89" font-size="20">CO₂ · 16 valence electrons</text></g>
<rect x="24" y="106" width="360" height="165" fill="#fff" stroke="#aec2d5" stroke-width="2" rx="13"/>
<rect x="425" y="106" width="400" height="165" fill="#fff" stroke="#aec2d5" stroke-width="2" rx="13"/>
