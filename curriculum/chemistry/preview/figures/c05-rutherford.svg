<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Most alpha particles pass; few deflect strongly</title><desc id="chartdesc">Rutherford's scattering interpretation: most alpha particles pass thin gold foil with little deflection, while a small number scatter through large angles, consistent with a concentrated positively charged nucleus. Trajectories are schematic.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">Most alpha particles pass; few deflect strongly</text></g><rect x="35" y="78" width="830" height="218" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="200" y="111" font-size="19" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">alpha-particle source</text><text x="460" y="111" font-size="19" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">thin metal foil</text><text x="740" y="111" font-size="19" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">detector</text><rect x="448" y="135" width="17" height="131" fill="#d9b36e" stroke="#87551c" stroke-width="2"/><path d="M110 160 L795 160" fill="none" stroke="#267b87" stroke-width="3" stroke-linecap="round"/><path d="M795 160 l-10 -6 l0 12 Z" fill="#267b87"/><path d="M110 182 L795 182" fill="none" stroke="#267b87" stroke-width="3" stroke-linecap="round"/><path d="M795 182 l-10 -6 l0 12 Z" fill="#267b87"/><path d="M110 204 L795 204" fill="none" stroke="#267b87" stroke-width="3" stroke-linecap="round"/><path d="M795 204 l-10 -6 l0 12 Z" fill="#267b87"/><path d="M110 226 L795 226" fill="none" stroke="#267b87" stroke-width="3" stroke-linecap="round"/><path d="M795 226 l-10 -6 l0 12 Z" fill="#267b87"/><path d="M110 190 L450 190 Q510 182 540 115" fill="none" stroke="#bf713d" stroke-width="4"/><path d="M110 218 L450 218 Q396 196 300 142" fill="none" stroke="#bf713d" stroke-width="4"/><text x="710" y="281" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">most pass; a few turn strongly</text></svg>
