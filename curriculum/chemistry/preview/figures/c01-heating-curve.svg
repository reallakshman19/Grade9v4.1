<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Energy input and an ideal melting plateau</title><desc id="chartdesc">Temperature rises while a pure solid warms, holds approximately constant during melting, then rises again as the liquid warms at stable pressure. Axes are qualitative.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">Energy input and an ideal melting plateau</text></g><rect x="45" y="75" width="815" height="210" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><path d="M95 250 L805 250" fill="none" stroke="#2a5873" stroke-width="3" stroke-linecap="round"/><path d="M95 250 L95 95" fill="none" stroke="#2a5873" stroke-width="3" stroke-linecap="round"/><polyline points="110,237 255,182 425,182 585,116 785,80" fill="none" stroke="#a56c25" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="160" font-size="17" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">warming solid</text><text x="342" y="170" font-size="17" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">melting</text><text x="510" y="103" font-size="17" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">warming liquid</text><text x="635" y="206" font-size="15" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">not to scale</text><text x="460" y="289" font-size="18" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Energy supplied →</text><text x="35" y="173" font-size="19" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">T</text></svg>
