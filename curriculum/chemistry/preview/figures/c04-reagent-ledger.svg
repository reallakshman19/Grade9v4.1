<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">A limiting-reactant ledger</title><desc id="chartdesc">For 2H2 plus O2 forming 2H2O, starting with 5 mol H2 and 2 mol O2 leaves 1 mol H2 after 4 mol water forms under the ideal complete-reaction model.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">A limiting-reactant ledger</text></g><rect x="35" y="78" width="830" height="220" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="180" y="130" font-size="24" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">5 H₂ + 2 O₂</text><text x="630" y="130" font-size="24" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">4 H₂O + 1 H₂</text><text x="438" y="126" font-size="29" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">→</text><text x="180" y="192" font-size="18" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">H₂ capacity: 5 ÷ 2 = 2.5</text><text x="180" y="221" font-size="18" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">O₂ capacity: 2 ÷ 1 = 2</text><text x="630" y="201" font-size="18" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">O₂ limits the reaction</text><text x="630" y="240" font-size="18" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">H₂ leftover = 1 mol</text></svg>
