<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Neutral ionic ratios are charge ledgers</title><desc id="chartdesc">Three calcium ions with charge plus two balance two phosphate ions with charge minus three, giving the simplest formula Ca3(PO4)2.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">Neutral ionic ratios are charge ledgers</text></g><rect x="35" y="78" width="830" height="215" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="248" y="129" font-size="25" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Ca²⁺ × 3</text><text x="600" y="129" font-size="25" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">PO₄³⁻ × 2</text><text x="443" y="129" font-size="30" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">+</text><text x="249" y="193" font-size="21" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">total +6</text><text x="597" y="193" font-size="21" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">total −6</text><text x="452" y="245" font-size="24" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Ca₃(PO₄)₂ : +6 − 6 = 0</text></svg>
