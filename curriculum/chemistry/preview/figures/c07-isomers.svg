<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
<title id="t">Two different structures with molecular formula C2H6O</title><desc id="d">Ethanol CH3-CH2-O-H has an oxygen hydrogen bond. Dimethyl ether CH3-O-CH3 has oxygen between carbon groups but no O-H bond. Both have molecular formula C2H6O.</desc>
<rect width="900" height="300" rx="18" fill="#f4f8fc"/>
<g font-family="system-ui,sans-serif" fill="#173550">
<text x="30" y="46" font-size="26" font-weight="700">Same formula ≠ same connectivity</text>
<text x="57" y="97" font-size="21" font-weight="700">Ethanol · CH₃CH₂OH</text>
<text x="491" y="97" font-size="21" font-weight="700">Dimethyl ether · CH₃OCH₃</text>
</g>
<rect x="28" y="115" width="405" height="155" rx="12" fill="white" stroke="#adc4d6" stroke-width="2"/>
<rect x="463" y="115" width="405" height="155" rx="12" fill="white" stroke="#adc4d6" stroke-width="2"/>
<g fill="#173550" font-family="system-ui,sans-serif" font-size="30" font-weight="650" text-anchor="middle">
<text x="90" y="208">CH₃</text><text x="212" y="208">CH₂</text><text x="317" y="208">O</text><text x="393" y="208">H</text>
<text x="527" y="208">CH₃</text><text x="660" y="208">O</text><text x="805" y="208">CH₃</text>
</g>
<g stroke="#286184" stroke-width="4" stroke-linecap="round"><path d="M131 196 H166 M255 196 H284 M343 196 H366 M574 196 H639 M685 196 H756"/></g>
<ellipse cx="354" cy="197" rx="74" ry="53" fill="none" stroke="#b66d36" stroke-dasharray="6 7" stroke-width="3"/>
<text x="290" y="254" font-size="16" font-family="system-ui,sans-serif" fill="#985323">Has O–H</text>
<text x="650" y="254" font-size="16" font-family="system-ui,sans-serif" fill="#985323">No O–H</text>
</svg>
