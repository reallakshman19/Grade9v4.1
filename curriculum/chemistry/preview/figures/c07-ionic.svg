<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
<title id="t">Ion mobility in solid and molten sodium chloride</title><desc id="d">In a rigid ionic lattice, sodium and chloride ions stay in repeating positions. When molten, ions are mobile and able to carry charge.</desc>
<rect width="900" height="340" rx="18" fill="#f2f7fc"/>
<g font-family="system-ui, sans-serif" fill="#173550">
<text x="35" y="44" font-size="26" font-weight="700">Same ions, different mobility</text>
<text x="45" y="91" font-size="21" font-weight="700">Solid NaCl</text><text x="490" y="91" font-size="21" font-weight="700">Molten NaCl</text>
<rect x="28" y="108" width="400" height="195" rx="14" fill="#ffffff" stroke="#adc4d6" stroke-width="2"/>
<rect x="473" y="108" width="400" height="195" rx="14" fill="#ffffff" stroke="#adc4d6" stroke-width="2"/>
<text x="45" y="325" font-size="17">Ions fixed in a lattice</text><text x="490" y="325" font-size="17">Ions can move through melt</text>
</g>
<g font-family="system-ui,sans-serif" font-size="18" text-anchor="middle" font-weight="700">
<g fill="#d9efff" stroke="#326a94" stroke-width="2">
<circle cx="96" cy="149" r="25"/><circle cx="186" cy="149" r="25"/><circle cx="276" cy="149" r="25"/><circle cx="366" cy="149" r="25"/>
<circle cx="96" cy="234" r="25"/><circle cx="186" cy="234" r="25"/><circle cx="276" cy="234" r="25"/><circle cx="366" cy="234" r="25"/>
</g>
<g fill="#fff0d8" stroke="#b17935" stroke-width="2">
<circle cx="141" cy="149" r="25"/><circle cx="231" cy="149" r="25"/><circle cx="321" cy="149" r="25"/>
<circle cx="141" cy="234" r="25"/><circle cx="231" cy="234" r="25"/><circle cx="321" cy="234" r="25"/>
</g>
<g fill="#173550">
<text x="96" y="155">Na⁺</text><text x="186" y="155">Na⁺</text><text x="276" y="155">Na⁺</text><text x="366" y="155">Na⁺</text>
<text x="96" y="240">Na⁺</text><text x="186" y="240">Na⁺</text><text x="276" y="240">Na⁺</text><text x="366" y="240">Na⁺</text>
<text x="141" y="155">Cl⁻</text><text x="231" y="155">Cl⁻</text><text x="321" y="155">Cl⁻</text>
<text x="141" y="240">Cl⁻</text><text x="231" y="240">Cl⁻</text><text x="321" y="240">Cl⁻</text>
</g>
</g>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="18" font-weight="700">
<g fill="#d9efff" stroke="#326a94" stroke-width="2"><circle cx="540" cy="154" r="29"/><circle cx="702" cy="243" r="29"/><circle cx="825" cy="157" r="29"/></g>
<g fill="#fff0d8" stroke="#b17935" stroke-width="2"><circle cx="651" cy="150" r="29"/><circle cx="794" cy="251" r="29"/><circle cx="573" cy="252" r="29"/></g>
<g fill="#173550"><text x="540" y="160">Na⁺</text><text x="702" y="249">Na⁺</text><text x="825" y="163">Na⁺</text><text x="651" y="156">Cl⁻</text><text x="794" y="257">Cl⁻</text><text x="573" y="258">Cl⁻</text></g>
</g>
