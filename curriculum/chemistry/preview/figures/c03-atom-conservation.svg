<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">A balanced equation preserves each element</title><desc id="chartdesc">Two H2 molecules and one O2 molecule form two H2O molecules. Four hydrogen atoms and two oxygen atoms appear on each side of the balanced equation.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">A balanced equation preserves each element</text></g><rect x="35" y="78" width="830" height="215" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="246" y="126" font-size="25" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">2 H₂ + O₂</text><text x="656" y="126" font-size="25" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">2 H₂O</text><text x="450" y="123" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">→</text><text x="220" y="183" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">H: 4 atoms</text><text x="650" y="183" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">H: 4 atoms</text><text x="220" y="223" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">O: 2 atoms</text><text x="650" y="223" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">O: 2 atoms</text><text x="450" y="252" font-size="18" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">coefficients change; subscripts stay</text></svg>
