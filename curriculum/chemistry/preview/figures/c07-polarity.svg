<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="t d">
<title id="t">Linear carbon dioxide and bent water with polarity vectors</title><desc id="d">Carbon dioxide has two equal polar C-O bonds opposite in a straight line so dipoles cancel. Water has two polar O-H bonds angled with oxygen at their vertex, giving a net dipole.</desc>
<rect width="860" height="300" rx="18" fill="#f4f8fc"/>
<g font-family="system-ui,sans-serif" fill="#19374f">
<text x="25" y="43" font-size="25" font-weight="700">Shape changes overall polarity</text>
<text x="41" y="88" font-size="21" font-weight="700">CO₂ · linear · net dipole 0</text>
<text x="453" y="88" font-size="21" font-weight="700">H₂O · bent · net dipole ≠ 0</text>
</g>
<g fill="white" stroke="#b9cbd8" stroke-width="2"><rect x="25" y="106" width="386" height="160" rx="12"/><rect x="445" y="106" width="390" height="160" rx="12"/></g>
<g stroke="#255579" stroke-width="5" stroke-linecap="round"><path d="M120 183 H184 M120 195 H184 M237 183 H300 M237 195 H300"/><path d="M635 173 L570 232 M635 173 L700 232"/></g>
<g font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#173550" text-anchor="middle"><text x="98" y="202">O</text><text x="211" y="202">C</text><text x="324" y="202">O</text><text x="635" y="172">O</text><text x="555" y="255">H</text><text x="715" y="255">H</text></g>
<g stroke="#b17935" stroke-width="4" stroke-linecap="round"><path d="M190 220 H140 M140 220 l12 -8 M140 220 l12 8"/><path d="M233 220 H284 M284 220 l-12 -8 M284 220 l-12 8"/><path d="M596 210 l33 -39 M629 171 l-5 15 M629 171 l-15 3"/><path d="M673 211 l-33 -39 M640 172 l16 2 M640 172 l5 15"/></g>
<text x="173" y="251" font-family="system-ui,sans-serif" fill="#8c5720" font-size="16">Opposite vectors</text>
<text x="562" y="285" font-family="system-ui,sans-serif" fill="#8c5720" font-size="16">Vectors do not cancel</text>
</svg>
