<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Isotopes preserve element identity</title><desc id="chartdesc">Carbon-12 and carbon-14 both have 6 protons and are carbon, but carbon-12 has 6 neutrons while carbon-14 has 8; atomic number stays the same while mass number changes.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">Isotopes preserve element identity</text></g><rect x="35" y="78" width="395" height="215" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><rect x="470" y="78" width="395" height="215" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="230" y="116" font-size="24" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Carbon-12</text><text x="668" y="116" font-size="24" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Carbon-14</text><text x="230" y="169" font-size="21" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">6 protons</text><text x="230" y="210" font-size="21" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">6 neutrons</text><text x="665" y="169" font-size="21" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">6 protons</text><text x="665" y="210" font-size="21" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">8 neutrons</text><text x="450" y="280" font-size="18" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">same Z = 6; different A</text></svg>
