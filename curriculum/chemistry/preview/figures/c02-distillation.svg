<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="charttitle chartdesc"><title id="charttitle">Distillation separates by volatility</title><desc id="chartdesc">In a teacher-operated model, water leaves brine as vapour, travels through a condenser and is collected in a receiver; nonvolatile salt remains in the heating vessel. Diagram omits apparatus safety fittings.</desc><rect width="900" height="320" rx="18" fill="#f4f8fb"/><g font-family="Arial, sans-serif" fill="#173550"><text x="30" y="44" font-size="26" font-weight="700">Distillation separates by volatility</text></g><rect x="30" y="78" width="840" height="220" fill="#fff" stroke="#98b5c7" stroke-width="2" rx="12"/><text x="145" y="113" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Heating vessel</text><text x="498" y="113" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Cooling path</text><text x="756" y="113" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">Receiver</text><path d="M90 185 Q92 250 152 251 Q210 250 210 187 L187 162 L113 162 Z" fill="#b4dce6" stroke="#24658c" stroke-width="4"/><path d="M150 170 L150 128 L355 128 Q382 128 382 160 L382 178 L635 178 L635 230 L730 230" stroke="#24658c" fill="none" stroke-width="5"/><path d="M730 229 L730 265 L801 265 L801 228" stroke="#24658c" fill="none" stroke-width="5"/><text x="150" y="277" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">brine: salt stays</text><text x="500" y="215" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">water vapour →</text><text x="760" y="288" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">distillate water</text><text x="478" y="156" font-size="15" font-family="Arial, sans-serif" text-anchor="middle" fill="#173550">condenser region</text></svg>
