name: NSEJS Physics Learner Navigation R1
on:
  pull_request:
    paths:
      - "nsejs/physics/**"
      - "nsejs/js/core2-physics-reader.js"
      - "tests/test_nsejs_physics_navigation_r1.py"
      - "tools/physics_navigation_browser_qa.py"
      - "tools/physics_quality_r1_browser_qa.py"
      - "tests/test_physics_quality_r1.py"
      - "tests/test_physics_41_structural_audit_r1.py"
      - "tools/physics_41_structural_audit_r1.py"
      - ".github/workflows/nsejs-physics-learner-navigation-r1.yml"
  workflow_dispatch:
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify navigation and learner assets syntax
        run: |
          node --check nsejs/physics/learn/chapter.js
          node --check nsejs/physics/learn/learner-nav.js
          node --check nsejs/physics/learn/learner-home.js
          node --check nsejs/js/core2-physics-reader.js
          node --check nsejs/physics/quality-r1/runtime.js
      - name: Install exact browser test requirements
        run: |
          python -m pip install "pytest>=8,<10" "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Verify exact published lesson routes and non-destructive controls
        run: python -m pytest -q tests/test_nsejs_physics_navigation_r1.py tests/test_physics_quality_r1.py tests/test_physics_ph01020708_qualification_gate_r00.py tests/test_physics_41_structural_audit_r1.py
      - name: Write 41-native-package structural and WPE comparator receipts
        run: python tools/physics_41_structural_audit_r1.py
      - name: Run portrait and landscape learner routes over HTTP Chromium
        run: python tools/physics_navigation_browser_qa.py
      - name: Verify four original authored Core1A/B construction journeys, exact source ledger and denied storage over HTTP Chromium
        run: python tools/physics_quality_r1_browser_qa.py
      - name: Upload six-viewport Core1A/B technical screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-four-core1a-core1b-quality-r1
          path: review-artifacts/physics-quality-r1/
          if-no-files-found: warn
      - name: Academic boundary
        if: always()
        run: echo "Navigation QA is technical only. Author candidate source, QRT and science HOLD unchanged."
