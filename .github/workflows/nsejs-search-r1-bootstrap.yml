name: NSEJS search R1 snapshot bootstrap
on:
  push:
    branches: [feat/nsejs-unified-search-all-pages-r1]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/nsejs-unified-search-all-pages-r1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build_search_index.py
      - run: node --check js/site-search.js && node --check js/site-header.js
      - run: pip install pytest && pytest -q tests/test_search_engine.py tests/test_nsejs_circuits_search_r1.py tests/test_nsejs_search_all_pages_r1.py
      - name: Commit generated snapshots to this feature branch only and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learner-search-index.v1.json data/learner-search-manifest.v1.json data/keyword-synonyms.v1.json nsejs/data/learner-search-index.v1.json nsejs/data/learner-search-manifest.v1.json nsejs/data/keyword-synonyms.v1.json
          git rm .github/workflows/nsejs-search-r1-bootstrap.yml
          git commit -m "Regenerate all-subject search snapshots and remove one-time bootstrap"
          git push origin HEAD:refs/heads/feat/nsejs-unified-search-all-pages-r1
