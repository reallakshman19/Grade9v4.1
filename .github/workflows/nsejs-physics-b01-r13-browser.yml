name: NSEJS B01 89-task tablet learner preview QA
on:
  pull_request:
    paths:
      - "nsejs/physics/curriculum/topics/PH07/b01/learner-preview/**"
      - "tests/test_nsejs_b01_takeover_r13.py"
      - "tools/physics_b01_r13_browser_qa.py"
      - "tools/physics_b01_r14_negative_qa.py"
      - ".github/workflows/nsejs-physics-b01-r13-browser.yml"
      - "nsejs/physics/curriculum/topics/PH07/b01/integrated-curriculum-review.html"
jobs:
  protected-sequence-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0 pytest==8.4.2
          python -m playwright install --with-deps chromium
      - name: Parse B01 learner JavaScript in Node
        run: node --check nsejs/physics/curriculum/topics/PH07/b01/learner-preview/runtime.js
      - name: Validate B01 source pins, scope and 89 task identities
        run: python -m pytest -q tests/test_nsejs_b01_takeover_r13.py
      - name: HTTP Chromium candidate learner journeys
        run: python tools/physics_b01_r13_browser_qa.py
      - name: HTTP Chromium R14 adversarial record and figure checks
        run: python tools/physics_b01_r14_negative_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-r13-http-chromium-candidate-receipts
          path: |
            review-artifacts/physics-b01-r13/
            review-artifacts/physics-b01-r14/
          if-no-files-found: ignore
