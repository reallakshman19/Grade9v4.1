name: NSEJS UX Reliability R1 - three bank and header contract
on:
  pull_request:
    paths:
      - "site-nav.js"
      - "nsejs/js/core2-physics-reader.js"
      - "nsejs/js/core2-chemistry-reader.js"
      - "nsejs/js/core2-biology-reader.js"
      - "nsejs/physics/index.html"
      - "nsejs/chemistry/index.html"
      - "nsejs/biology/index.html"
      - "tests/test_nsejs_ux_reliability_r1.py"
      - "tools/nsejs_bank_ux_regression_r1.py"
      - ".github/workflows/nsejs-ux-reliability-r1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-subject-banks:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check all shared scripts
        run: |
          node --check site-nav.js
          node --check nsejs/js/core2-physics-reader.js
          node --check nsejs/js/core2-chemistry-reader.js
          node --check nsejs/js/core2-biology-reader.js
          python -m py_compile tools/nsejs_bank_ux_regression_r1.py
      - name: Guard all seven UX corrections
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_nsejs_ux_reliability_r1.py
      - name: Install pinned HTTP Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify three real banks across portrait and landscape including failed fetches
        run: python tools/nsejs_bank_ux_regression_r1.py
      - name: Review boundary
        if: always()
        run: echo "Technical UX tests only - independent academic and trusted R3 production HOLD unchanged"
