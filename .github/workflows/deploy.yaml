name: Deploy to GitHub Pages (labeled technical preview)

# Owner-authorized learning preview: ordinary updates publish without the
# independent academic R3 production prerequisites. Candidate tiles disclose
# review status. The signed, fail-closed R3 lane is deploy-r3-signed.yaml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/owner-technical-preview-pages.yml
