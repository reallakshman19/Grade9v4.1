name: Publish unreviewed owner-directed technical preview

# This is a deliberately separate owner-directed preview, not R3-approved
# production or academic release. The signed R3 lane stays in deploy-r3-signed.yaml.
# Owner-directed unreviewed PREVIEW update: PH03 candidate coverage, PH06
# foundations and common header from PR #84, retaining academic HOLD.
# This workflow also serves as the reusable tested publisher for deploy.yaml.
# Next scoped owner-directed preview refresh: remove duplicated legacy search
# launchers under the shared header on nested NSEJS Physics lesson pages.
# This affects UI navigation only; academic/source acceptance remains HOLD.
# Owner-directed repair: restore visible Physics Question Bank (six topics,
# 109 candidate records) after it was hidden by the collapsed legacy archive;
# keep the chapter navigation and all source/academic review statuses HOLD.
# Owner-directed Core1A/Core1B question Skip R3: inline no-credit navigation,
# no fabricated first attempts, answer access or academic mastery.
# Owner-directed UX Reliability R1: bank visibility/failure states, answer-safe
# search, fresh counts, return-to-topics, sitewide navigation smoke and
# last-lesson links only. Source, QRT, academic and signed R3 status stay HOLD.
# The main Pages entrypoint handles push publication; manual preview is also available.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact owner-selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify all shared navigation and bank reader JavaScript syntax
        run: |
          node --check site-nav.js
          node --check nsejs/js/core2-physics-reader.js
          node --check nsejs/js/core2-chemistry-reader.js
          node --check nsejs/js/core2-biology-reader.js
          node --check nsejs/js/skip-mandatory-response.js
      - name: Verify three bank UX and answer-search reliability contracts (no install)
        run: |
          python3 - <<'PY'
          import runpy
          suite=runpy.run_path("tests/test_nsejs_ux_reliability_r1.py")
          tests=[(name,fn) for name,fn in suite.items()
                 if name.startswith("test_") and callable(fn)]
          if len(tests)!=7:
              raise SystemExit("UX_RELIABILITY_TEST_DISCOVERY_INCOMPLETE")
          for name,fn in tests:
              fn()
              print("PASS:",name)
          print("UX_RELIABILITY_PREVIEW_GATE_PASS: 7/7")
          PY
      - name: Verify Core1A/Core1B Skip reaches every learner-response entrypoint
        run: python3 tools/audit_skip_coverage.py
      - name: Rebuild safe learner search index from exact revision
        run: |
          python3 tools/build_search_index.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/learner-search-index.v1.json")
          mirror = Path("nsejs/data/learner-search-index.v1.json")
          documents = json.loads(root.read_text(encoding="utf-8"))
          assert documents and root.read_bytes() == mirror.read_bytes(), "SEARCH_INDEX_MISSING_OR_MISMATCH"
          counts = {subject: sum(d.get("subject") == subject and d.get("category") == "question" for d in documents) for subject in ("Chemistry", "Biology")}
          assert counts["Chemistry"] >= 119 and counts["Biology"] >= 119, f"QUESTION_BANK_NOT_INDEXED:{counts}"
          for row in documents:
              if row.get("category") == "question":
                  assert not row.get("options") and not row.get("hints"), "ANSWER_BEARING_SEARCH_INDEX"
          print("Learner search index rebuilt:", len(documents), "routes; subject question counts:", counts)
          PY
      - name: Stage public static website only (no review evidence or workspace files)
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 tools/stage_public_preview.py
      - name: Audit full staged website and rebuilt search index
        run: |
          python3 tools/audit_search_full.py \
            --repo . --staged public \
            --json-output artifacts/search-audit/full-site.json \
            --summary-output artifacts/search-audit/full-site.md
          cat artifacts/search-audit/full-site.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish search audit and exact generated index evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-full-search-publication-audit
          path: |
            artifacts/search-audit/
            data/learner-search-index.v1.json
            data/learner-search-manifest.v1.json
          if-no-files-found: error
      - name: Upload public preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy unreviewed technical preview
        id: deployment
        uses: actions/deploy-pages@v4
