name: Publish unreviewed owner-directed technical preview

# This is a deliberately separate owner-directed preview, not R3-approved
# production or academic release. The signed R3 deployment remains unchanged.
# One automatic run when this workflow is first merged; later runs are manual.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/owner-technical-preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact owner-selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify all shared navigation and bank reader JavaScript syntax
        run: |
          node --check site-nav.js
          node --check nsejs/js/core2-chemistry-reader.js
          node --check nsejs/js/core2-biology-reader.js
      - name: Rebuild safe learner search index from exact revision
        run: |
          python3 tools/build_search_index.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/learner-search-index.v1.json")
          mirror = Path("nsejs/data/learner-search-index.v1.json")
          documents = json.loads(root.read_text(encoding="utf-8"))
          assert documents and root.read_bytes() == mirror.read_bytes(), "SEARCH_INDEX_MISSING_OR_MISMATCH"
          counts = {subject: sum(d.get("subject") == subject and d.get("category") == "question" for d in documents) for subject in ("Chemistry", "Biology")}
          assert counts["Chemistry"] >= 119 and counts["Biology"] >= 119, f"QUESTION_BANK_NOT_INDEXED:{counts}"
          for row in documents:
              if row.get("category") == "question":
                  assert not row.get("options") and not row.get("hints"), "ANSWER_BEARING_SEARCH_INDEX"
          print("Learner search index rebuilt:", len(documents), "routes; subject question counts:", counts)
          PY
      - name: Stage public static website only (no review evidence or workspace files)
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import re
          import posixpath
          from pathlib import Path

          out = Path("public")
          out.mkdir(exist_ok=True)
          web_roots = (
              "architecture", "chemistry", "css", "curriculum", "data",
              "docs", "examples", "js", "mathematics", "nsejs", "physics",
              "preview", "reference", "templates",
          )
          web_suffixes = {
              ".html", ".htm", ".css", ".js", ".mjs", ".json", ".svg",
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".woff", ".woff2", ".ttf", ".txt", ".webmanifest",
          }
          blocked = {
              ".git", ".github", "review", "tests", "tools", "src",
              "workspace", "schemas", "__pycache__", "node_modules",
              ".venv", "private", "secrets",
          }

          def stage(path):
              if path.is_symlink() or not path.is_file():
                  return
              if any(part in blocked or part.startswith(".") for part in path.parts):
                  return
              if path.suffix.lower() not in web_suffixes:
                  return
              target = out / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
              if target.suffix.lower() in {".html", ".htm"}:
                  raw = target.read_text(encoding="utf-8")
                  if re.search(r"</body\s*>", raw, flags=re.I):
                      # A single common header, including existing mastheads and
                      # legacy pages, without modifying the source HTML checkout.
                      if "data-grade9-nav" not in raw:
                          rel = posixpath.relpath("public/site-nav.js", target.parent.as_posix())
                          tag = '<script defer src="' + rel + '" data-grade9-nav="common-r1"></script>'
                          raw = re.sub(r"</body\s*>", lambda m: tag + "\n" + m.group(0),
                                       raw, count=1, flags=re.I)
                      target.write_text(raw, encoding="utf-8")

          for name in ("index.html", "site.css", "site-nav.js"):
              source = Path(name)
              if source.is_file():
                  stage(source)
          for name in web_roots:
              folder = Path(name)
              if folder.is_dir():
                  for item in folder.rglob("*"):
                      stage(item)
          if not (out / "index.html").is_file():
              raise SystemExit("PREVIEW_MISSING_ROOT_INDEX")
          if not (out / "site-nav.js").is_file():
              raise SystemExit("PREVIEW_COMMON_HEADER_MISSING")
          for p in ("data/learner-search-index.v1.json", "nsejs/data/learner-search-index.v1.json"):
              if not (out / p).is_file() or (out / p).stat().st_size < 100:
                  raise SystemExit("PREVIEW_SEARCH_INDEX_MISSING:" + p)
          for p in ("nsejs/chemistry/index.html", "nsejs/biology/index.html"):
              page = (out / p).read_text(encoding="utf-8")
              if 'data-grade9-nav="common-r1"' not in page:
                  raise SystemExit("PREVIEW_COMMON_NAV_NOT_INSTALLED:" + p)
          html_pages = 0
          for page_file in out.rglob("*.html"):
              page = page_file.read_text(encoding="utf-8")
              if re.search(r"</body\s*>", page, flags=re.I):
                  html_pages += 1
                  if "data-grade9-nav" not in page:
                      raise SystemExit("PREVIEW_COMMON_NAV_MISSING:" + str(page_file))
          if html_pages == 0:
              raise SystemExit("PREVIEW_NO_HTML_PAGES")
          print("All published HTML pages with a body have the common header loader:", html_pages)
          (out / ".nojekyll").touch()
          (out / "preview-release-status.json").write_text(
              json.dumps({
                  "kind": "OWNER_DIRECTED_UNREVIEWED_TECHNICAL_PREVIEW",
                  "academic_status": "HOLD",
                  "r3_signed_production_release": False,
                  "source_sha": os.environ["RELEASE_SHA"],
                  "warning": "Source pages are technical candidates, not independently accepted academic material.",
              }, indent=2) + "\n", encoding="utf-8",
          )
          print("Staged static preview; review, tests, workspace and source code excluded.")
          PY
      - name: Upload public preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy unreviewed technical preview
        id: deployment
        uses: actions/deploy-pages@v4
