name: Chemistry textbook tablet browser QA (candidate)
on:
  pull_request:
    paths:
      - "curriculum/chemistry/**"
      - "tools/chemistry_textbook_browser_qa.py"
      - ".github/workflows/chemistry-textbook-preview.yml"
  workflow_dispatch:
jobs:
  chemistry-tablet-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser testing
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test seven Chemistry textbook routes under HTTP
        run: python tools/chemistry_textbook_browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chemistry-candidate-tablet-screenshots
          path: chemistry-tablet-artifacts/
          if-no-files-found: ignore
