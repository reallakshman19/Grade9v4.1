name: PH09-PH12 WPE-parity author preview QA
on:
  pull_request:
    paths:
      - 'review/physics/ph09-ph12-wpe-parity-r1/**'
      - 'tests/test_nsejs_physics_ph09_ph12_wpe_parity_r1.py'
      - 'tools/physics_ph09_ph12_wpe_parity_browser_qa.py'
      - '.github/workflows/ph09-ph12-wpe-parity-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-technical:
    name: AUTHOR-EXPOSED · TECHNICAL ONLY · ACADEMIC HOLD
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==8.4.2 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: node --check review/physics/ph09-ph12-wpe-parity-r1/preview.js
      - run: |
          mkdir -p review-artifacts/physics-ph09-ph12-parity-r1
          python -m pytest -q tests/test_nsejs_physics_ph09_ph12_wpe_parity_r1.py | tee review-artifacts/physics-ph09-ph12-parity-r1/pytest.txt
      - run: |
          python tools/physics_ph09_ph12_wpe_parity_browser_qa.py
      - name: Record tested revision
        if: always()
        run: |
          mkdir -p review-artifacts/physics-ph09-ph12-parity-r1
          git rev-parse HEAD > review-artifacts/physics-ph09-ph12-parity-r1/tested-head.txt
          find review/physics/ph09-ph12-wpe-parity-r1 -type f -print0 | sort -z | xargs -0 sha256sum > review-artifacts/physics-ph09-ph12-parity-r1/candidate-sha256.txt
          printf '%s\n' 'ACADEMIC_HOLD: No source, science, QRT, B1-B7 or release authority from this workflow.' > review-artifacts/physics-ph09-ph12-parity-r1/ACADEMIC_HOLD.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ph09-ph12-author-preview-technical-receipts
          path: review-artifacts/physics-ph09-ph12-parity-r1/
