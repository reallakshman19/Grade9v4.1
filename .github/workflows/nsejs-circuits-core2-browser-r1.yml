name: NSEJS Circuits Core2 HTTP Chromium R1

on:
  pull_request:
    paths:
      - "nsejs/assets/fig_nsejs_circ_l*.svg"
      - "nsejs/physics/assets/fig_nsejs_circ_l*.svg"
      - "nsejs/data/circuits-level*-core2-candidates.v1.json"
      - "nsejs/data/physics-authored-practice-r1.json"
      - "nsejs/js/core2-physics-reader.js"
      - "nsejs/physics/index.html"
      - "tools/nsejs_circuits_core2_browser_qa.py"
      - ".github/workflows/nsejs-circuits-core2-browser-r1.yml"
  push:
    branches: ["audit/circuits-core2-source-complete-r1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  circuits-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Candidate-only Core2 HTTP Chromium safety and tablet checks
        run: python tools/nsejs_circuits_core2_browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuits-core2-chromium-r1-receipts
          path: review-artifacts/circuits-core2/
          if-no-files-found: warn
