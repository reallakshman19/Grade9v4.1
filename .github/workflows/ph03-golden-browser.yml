name: PH03 Golden Sample browser
on:
  pull_request:
    paths:
      - 'nsejs/physics/ph03/**'
      - 'nsejs/physics/curriculum/topics/PH03/**'
      - 'nsejs/physics/textbook/PH03/**'
      - 'nsejs/physics/core1/PH03/**'
      - 'tools/ph03_golden_browser.py'
      - 'tools/ph03_golden_r2_browser.py'
      - 'tools/ph03_skip_browser_qa.py'
      - 'tests/test_ph03_skip_r2.py'
      - '.github/workflows/ph03-golden-browser.yml'
jobs:
  ph03-golden-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse PH03 source-led R2 as an ES module
        run: node --input-type=module --check < nsejs/physics/ph03/source-led-r2/reader.js
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/ph03_golden_browser.py
      - run: python tools/ph03_golden_r2_browser.py
      - name: PH03 skip/undo, no-credit, persistence, and fail-closed Chromium
        run: python tools/ph03_skip_browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ph03-golden-browser
          path: |
            artifacts/ph03-golden-r1/
            artifacts/ph03-golden-r2/
            artifacts/ph03-r2-skip/
