name: PH02 Forces candidate full browser QA

on:
  push:
    branches:
      - feat/nsejs-physics-a02-ph02-forces-candidate-r1
  pull_request:
    paths:
      - 'nsejs/physics/ph02/**'
      - 'nsejs/physics/textbook/PH02/**'
      - 'nsejs/physics/core1/PH02/**'
      - 'nsejs/physics/curriculum/agent1/PH02/**'
      - 'tools/physics_ph02_browser_qa.py'
      - 'tests/test_ph02_candidate_routes.py'
      - '.github/workflows/physics-ph02-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ph02-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8,<10' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Native PH02 static and source guards
        run: python -m pytest -q tests/test_ph02_candidate_routes.py
      - name: PH02 six-stage HTTP Chromium, 12.7in tablet orientations and save-failure control
        run: python tools/physics_ph02_browser_qa.py
      - name: Generate exact-byte SHA256 and line-quoted author evidence preparation
        if: always()
        run: |
          python tools/physics_ph02_author_evidence_prep.py
          python tools/physics_ph02_task_evidence_prep.py
      - name: Upload PH02 browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ph02-candidate-browser-qa
          path: review-artifacts/physics-ph02/
          if-no-files-found: warn
