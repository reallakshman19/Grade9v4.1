name: Production Control R3 - trusted decision
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  statuses: write
jobs:
  trusted-decision:
    runs-on: ubuntu-24.04
    steps:
      - name: Set exact-head pending decision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context=g9/r3-production-decision -f description='Trusted R3 decision running'
      - name: Checkout trusted base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate bytes without executing them
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema
      - name: Fail closed using base-owned code and external trust roster
        id: decision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          G9_R3_TRUST_JSON: ${{ vars.G9_R3_TRUST_JSON }}
        run: |
          python -I trusted/docs/agent-entry/production-control-r3/control.py --repo candidate --base "$BASE_SHA" --head "$HEAD_SHA" --pr-author "$PR_AUTHOR"
      - name: Publish trusted decision to the candidate head, even on failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.decision.outcome }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context=g9/r3-production-decision -f description="Trusted R3 decision: $state"
