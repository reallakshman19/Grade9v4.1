name: Production Control R3 - trusted decision
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  trusted-decision:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate bytes without executing them
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema
      - name: Fail closed using base-owned code and external trust roster
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          G9_R3_TRUST_JSON: ${{ vars.G9_R3_TRUST_JSON }}
        run: |
          python -I trusted/docs/agent-entry/production-control-r3/control.py --repo candidate --base "$BASE_SHA" --head "$HEAD_SHA" --pr-author "$PR_AUTHOR"
