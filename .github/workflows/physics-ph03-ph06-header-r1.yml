name: Physics Momentum / Fluids / common header HTTP acceptance
on:
  pull_request:
    paths:
      - 'nsejs/physics/ph03/complete-r3/**'
      - 'nsejs/physics/textbook/PH03/**'
      - 'nsejs/physics/core1/PH03/**'
      - 'nsejs/physics/textbook/PH06/**'
      - 'nsejs/physics/learn/**'
      - 'nsejs/physics/index.html'
      - 'site-nav.js'
      - 'tests/test_ph03_full_r3.py'
      - 'tests/test_ph03_core1ab_r4.py'
      - 'tests/test_ph03_ph06_recovery_nav_r1.py'
      - 'tools/ph03_full_r3_browser.py'
      - 'tools/physics_ph03_ph06_header_browser_r1.py'
      - '.github/workflows/physics-ph03-ph06-header-r1.yml'
  workflow_dispatch:
jobs:
  science-and-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse shared header and Momentum native JS as modules
        run: |
          node --check site-nav.js
          node --check nsejs/physics/learn/chapter.js
          node --input-type=module --check < nsejs/physics/ph03/complete-r3/reader.js
      - name: Check science, source gates, and route counts
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ph03_full_r3.py tests/test_ph03_core1ab_r4.py tests/test_ph03_ph06_recovery_nav_r1.py tests/test_nsejs_physics_navigation_r1.py tests/test_nsejs_physics_navigation_r2.py
  browser-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check native Momentum, Fluids and common header in portrait and landscape
        run: python tools/physics_ph03_ph06_header_browser_r1.py
      - name: Exercise six Momentum full protected workflows, provenance and negative controls
        run: python tools/ph03_full_r3_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-recovery-http-browser-evidence
          path: |
            artifacts/ph03-ph06-recovery/
            artifacts/ph03-complete-r3/
          if-no-files-found: ignore
