name: PH06 Golden Sample R2 WPE parity QA
on:
  pull_request:
    paths:
      - 'nsejs/physics/ph06/**'
      - 'nsejs/physics/textbook/PH06/**'
      - 'nsejs/physics/core1/PH06/**'
      - 'nsejs/physics/curriculum/topics/PH06/**'
      - 'tests/test_ph06_golden_r1.py'
      - 'tests/test_ph06_skip_lazy_r3.py'
      - 'tools/ph06_golden_browser_qa.py'
      - 'tools/ph06_golden_evidence.py'
      - '.github/workflows/ph06-golden-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==8.4.2 playwright==1.55.0 jsonschema
      - run: python -m playwright install --with-deps chromium
      - run: node --input-type=module --check < nsejs/physics/ph06/reader.js
      - run: |
          mkdir -p artifacts/ph06-golden
          set -o pipefail
          python -m pytest -q -s tests/test_ph06_golden_r1.py tests/test_ph06_skip_lazy_r3.py | tee artifacts/ph06-golden/science-tests.txt
      - run: |
          set -o pipefail
          python tools/ph06_golden_browser_qa.py | tee artifacts/ph06-golden/browser-tests.txt
      - name: Generate exact-head author evidence packet and run actual R2 validator (expected HOLD)
        run: python tools/ph06_golden_evidence.py
      - name: Compute exact author evidence file hashes
        if: always()
        run: |
          mkdir -p artifacts/ph06-golden
          find nsejs/physics/ph06 nsejs/physics/textbook/PH06 nsejs/physics/core1/PH06 nsejs/physics/curriculum/topics/PH06 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/ph06-golden/sha256.txt
          git rev-parse HEAD > artifacts/ph06-golden/tested-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ph06-golden-browser-receipts
          path: artifacts/ph06-golden/
