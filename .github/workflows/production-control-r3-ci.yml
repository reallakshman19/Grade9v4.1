name: Production Control R3 - candidate regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest jsonschema
      - run: python -m pytest -q tests/test_production_control_r3.py tests/test_physics_quality_gate_r2.py
      - name: Distinguish negative-control tests from publication
        run: echo 'REGRESSION ONLY; neither Golden adoption nor release authorization.'
